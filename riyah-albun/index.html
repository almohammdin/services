<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>دراسة رياح البن - دخول خاص</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f4ef;color:#102538;font-family:Tahoma,Arial,sans-serif;direction:rtl}.card{width:min(460px,calc(100% - 30px));background:#fff;border:1px solid #dde3e8;border-radius:22px;padding:30px;box-shadow:0 18px 50px rgba(17,37,56,.08)}.brand{font-size:11px;color:#8b671e;font-weight:700}h2{margin:7px 0}.card p{color:#657684;font-size:13px}.r{display:flex;gap:8px}input{flex:1;border:1px solid #ccd5dd;border-radius:10px;padding:11px;text-align:center;direction:ltr}button{border:0;border-radius:10px;background:#0b1f33;color:#fff;padding:10px 16px;font-weight:700}.msg{font-size:12px;color:#9a433d;margin-top:8px}</style><script src="patch.js"></script></head><body><div class="card"><div class="brand">نايف المحمدي · دراسة خاصة</div><h2>دراسة شركة رياح البن للتجارة</h2><p>أدخل رمز الوصول لفتح الدراسة.</p><div class="r"><input id="pw" inputmode="numeric" autofocus><button id="go">فتح</button></div><div id="msg" class="msg"></div></div><script>const F=['p1.txt','p2.txt','p3.txt','p4.txt','p5.txt','p6.txt','p7.txt'],S='+qOluUbw73RtlRRTBE9qRg==',V='ikaOHy00hdoNHU7w',I=250000,b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));async function key(p){let e=new TextEncoder(),k=await crypto.subtle.importKey('raw',e.encode(p),{name:'PBKDF2'},false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b(S),iterations:I,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])}async function data(){return(await Promise.all(F.map(f=>fetch(f,{cache:'no-store'}).then(r=>r.text())))).join('')}async function unzip(x){let ds=new DecompressionStream('gzip'),s=new Blob([x]).stream().pipeThrough(ds);return new Uint8Array(await new Response(s).arrayBuffer())}async function openStudy(){let m=document.getElementById('msg'),p=document.getElementById('pw').value.trim();m.textContent='جاري التحقق...';try{let[k,d]=await Promise.all([key(p),data()]),x=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(V)},k,b(d)),h=new TextDecoder().decode(await unzip(x));if(window.transformStudy)h=window.transformStudy(h);document.open();document.write(h);document.close()}catch(e){m.textContent='رمز الوصول غير صحيح.'}}go.onclick=openStudy;pw.onkeydown=e=>{if(e.key==='Enter')openStudy()};</script></body></html>
