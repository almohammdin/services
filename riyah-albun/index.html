const FILES=["p1.txt","p2.txt","p3.txt","p4.txt","p5.txt","p6.txt","p7.txt"],SALT="+qOluUbw73RtlRRTBE9qRg==",IV="ikaOHy00hdoNHU7w",ITER=250000;
const NEW_SECTION="<section class=\"section\">\n <div class=\"section-head\">\n  <div><h2>فئات الأسهم المقترحة لرياح البن</h2><p class=\"sub\">يمكن استخدام فئات الأسهم لتوزيع حقوق الإدارة والتصويت والحقوق المالية بطريقة تخدم المؤسس والمستثمرين وفق النظام الأساس.</p></div>\n  <span class=\"tag\">الحقوق تحدد في النظام الأساس</span>\n </div>\n <div class=\"founder-options\">\n  <div class=\"founder-option recommended\">\n   <strong>المقترح الأول</strong>\n   <h3>الفئة (أ) · أسهم المؤسس</h3>\n   <p>تكون مملوكة لسلطان، وتمنحه حقوقاً أعلى في الإدارة أو التصويت، مثل حق تعيين عضو في مجلس الإدارة أو قوة تصويت أعلى أو اشتراط نسبة تصويت تمنحه أثراً في بعض القرارات الجوهرية.</p>\n  </div>\n  <div class=\"founder-option\">\n   <h3>الفئة (ب) · أسهم استثمارية</h3>\n   <p>تخصص لبقية المساهمين أو المستثمرين الجدد، وتمنح حقوقاً مالية محددة مثل أولوية في التوزيعات أو حقوق مالية أخرى وفق شروط الإصدار، مع تحديد حقوق التصويت في النظام الأساس.</p>\n  </div>\n  <div class=\"founder-option\">\n   <h3>فئة خاصة عند دخول مستثمر</h3>\n   <p>يمكن إنشاء فئة تناسب صفقة معينة، مثل أسهم ممتازة أو أسهم قابلة للاسترداد، عندما يكون للمستثمر احتياج مالي أو مسار خروج محدد.</p>\n  </div>\n </div>\n <div style=\"height:14px\"></div>\n <div class=\"redeem-explain\">\n  <h3>الأسهم القابلة للاسترداد</h3>\n  <p style=\"margin:0;color:#506b65;font-size:12px\">هي أسهم يدخل بها المستثمر كمساهم، وتكتب من البداية شروط استردادها. عند تحقق الشروط المحددة، تستطيع الشركة استرداد هذه الأسهم وفق آلية وسعر أو معادلة منصوص عليها في شروط الإصدار.</p>\n  <div class=\"redeem-flow\">\n   <div class=\"redeem-step\"><b>1 · دخول المستثمر</b>يكتتب في فئة قابلة للاسترداد ويصبح مساهماً.</div>\n   <div class=\"redeem-step\"><b>2 · تحديد الشروط</b>تحدد الوثائق متى يجوز الاسترداد وكيف يحسب المقابل.</div>\n   <div class=\"redeem-step\"><b>3 · تحقق الشرط</b>مثلاً بلوغ نتائج مالية أو مرور مدة محددة وفق الصياغة المعتمدة.</div>\n   <div class=\"redeem-step\"><b>4 · الاسترداد</b>تتخذ الشركة قرار الاسترداد وتنفذه وفق الشروط والضوابط النظامية.</div>\n  </div>\n  <div class=\"redeem-note\"><b>مثال لرياح البن:</b> يدخل مستثمر في فئة قابلة للاسترداد، وتنص شروط الإصدار على أنه عند تحقق نتائج مالية محددة خلال مدة معينة يجوز للشركة استرداد أسهمه وفق معادلة تقييم أو سعر استرداد متفق عليه مسبقاً. تأثير سلطان يأتي من حقوق الفئة (أ) ونسب القرارات، بينما يكون الاسترداد قراراً للشركة وفق شروط الإصدار.</div>\n </div>\n <div class=\"share-law-map\">\n  <div class=\"share-law\"><b>م108</b><span>أنواع الأسهم وفئاتها والحقوق المرتبطة بكل فئة.</span></div>\n  <div class=\"share-law\"><b>م142</b><span>طريقة إدارة المساهمة المبسطة والتعيين والعزل والصلاحيات.</span></div>\n  <div class=\"share-law\"><b>م145</b><span>نصاب اجتماعات المساهمين وأنصبة القرارات.</span></div>\n  <div class=\"share-law\"><b>اللائحة 51/53</b><span>ضوابط الأسهم الممتازة والقابلة للاسترداد.</span></div>\n </div>\n</section>";

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pass){const enc=new TextEncoder();const base=await crypto.subtle.importKey("raw",enc.encode(pass),{name:"PBKDF2"},false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);}
async function loadPayload(){const parts=await Promise.all(FILES.map(f=>fetch(f,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("load");return r.text();})));return parts.join("");}
async function gunzip(bytes){const ds=new DecompressionStream("gzip");const stream=new Blob([bytes]).stream().pipeThrough(ds);return new Uint8Array(await new Response(stream).arrayBuffer());}
function develop(html){
  const shares=/<section class="section">[\s\S]*?<h2>فهم الأسهم من زاوية المؤسس<\/h2>[\s\S]*?<\/section>/;
  if(shares.test(html)) html=html.replace(shares,NEW_SECTION);
  html=html.replaceAll("الأسهم القابلة للاسترداد بلغة غير المختص","الأسهم القابلة للاسترداد");
  html=html.replaceAll("واضح","").replaceAll("مبسط","").replaceAll("الخلاصة العملية","");
  if(!html.includes('rel="icon"')) html=html.replace("</head>",'<link rel="icon" type="image/png" href="'+FAVICON+'"></head>');
  return html;
}
async function openStudy(){const pw=document.getElementById("pw").value.trim(),msg=document.getElementById("msg");msg.textContent="جاري التحقق...";try{const [key,data]=await Promise.all([derive(pw),loadPayload()]);const dec=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(data));let html=new TextDecoder().decode(await gunzip(dec));html=develop(html);document.open();document.write(html);document.close();}catch(e){msg.textContent="رمز الوصول غير صحيح.";}}
document.getElementById("go").addEventListener("click",openStudy);document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")openStudy();});
