<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>دراسة رياح البن - دخول خاص</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f4ef;color:#102538;font-family:Tahoma,Arial,sans-serif;direction:rtl}.card{width:min(470px,calc(100% - 28px));background:#fff;border:1px solid #dfe4ea;border-radius:22px;padding:30px;box-shadow:0 18px 50px rgba(17,37,56,.10)}.brand{font-size:11px;color:#8b671e;font-weight:700;margin-bottom:10px;direction:ltr;text-align:right}h1{font-size:23px;margin:0 0 7px}p{font-size:13px;color:#607080;margin:0 0 18px;line-height:1.8}label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.input-row{display:flex;gap:8px}input{flex:1;min-width:0;border:1px solid #cfd7df;border-radius:11px;padding:12px 13px;font-size:16px;direction:ltr;letter-spacing:2px;text-align:center}button{border:0;border-radius:11px;padding:11px 18px;background:#0b1f33;color:#fff;font-weight:700;cursor:pointer}.msg{min-height:24px;margin-top:10px;font-size:12px;color:#9a433d}.small{font-size:10.5px;color:#8b98a5;margin-top:18px;padding-top:12px;border-top:1px solid #edf0f3}</style></head><body><div class="card"><div class="brand">NAIF ALMOHAMMDI · PRIVATE CLIENT STUDY</div><h1>دراسة شركة رياح البن للتجارة</h1><p>صفحة خاصة موجهة إلى الشركة وشركائها. أدخل رمز الوصول لفتح الدراسة.</p><label for="pw">رمز الوصول</label><div class="input-row"><input id="pw" inputmode="numeric" autocomplete="off" maxlength="20" autofocus><button id="go">فتح</button></div><div id="msg" class="msg"></div><div class="small">محتوى الدراسة محفوظ بصيغة مشفرة ويفتح عبر رمز الوصول.</div></div><script>
const FILES=["p1.txt","p2.txt","p3.txt","p4.txt","p5.txt","p6.txt","p7.txt"],SALT="076rgR7HGQaAeM/P35kLJA==",IV="9mqizFuEJs7BDREw",ITER=250000;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pass){const e=new TextEncoder(),b=await crypto.subtle.importKey("raw",e.encode(pass),{name:"PBKDF2"},false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},b,{name:"AES-GCM",length:256},false,["decrypt"])}
async function ungzip(bytes){const ds=new DecompressionStream("gzip"),s=new Blob([bytes]).stream().pipeThrough(ds);return new Uint8Array(await new Response(s).arrayBuffer())}
async function openStudy(){const m=document.getElementById("msg");m.textContent="جاري التحقق...";try{const [k,parts]=await Promise.all([derive(document.getElementById("pw").value.trim()),Promise.all(FILES.map(f=>fetch(f,{cache:"no-store"}).then(r=>r.text())))]);const c=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},k,b64(parts.join(""))),p=await ungzip(c),h=new TextDecoder().decode(p);document.open();document.write(h);document.close()}catch(e){m.textContent="رمز الوصول غير صحيح."}}
document.getElementById("go").onclick=openStudy;document.getElementById("pw").onkeydown=e=>{if(e.key==="Enter")openStudy()};
</script></body></html>
