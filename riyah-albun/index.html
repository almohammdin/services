<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>دراسة رياح البن - دخول خاص</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f4ef;color:#102538;font-family:Tahoma,Arial,sans-serif;direction:rtl}.card{width:min(460px,calc(100% - 30px));background:#fff;border:1px solid #dde3e8;border-radius:22px;padding:30px}.brand{font-size:11px;color:#8b671e;font-weight:700}.card p{color:#657684;font-size:13px}.r{display:flex;gap:8px}input{flex:1;border:1px solid #ccd5dd;border-radius:10px;padding:11px;text-align:center}button{border:0;border-radius:10px;background:#0b1f33;color:#fff;padding:10px 16px;font-weight:700}.msg{font-size:12px;color:#9a433d;margin-top:8px}</style></head><body><div class="card"><div class="brand">NAIF ALMOHAMMDI · PRIVATE CLIENT STUDY</div><h2>دراسة شركة رياح البن للتجارة</h2><p>أدخل رمز الوصول لفتح الدراسة.</p><div class="r"><input id="pw" inputmode="numeric" autofocus><button id="go">فتح</button></div><div id="msg" class="msg"></div></div><script> const F=['p1.txt','p2.txt','p3.txt','p4.txt','p5.txt','p6.txt','p7.txt'],S='+qOluUbw73RtlRRTBE9qRg==',V='ikaOHy00hdoNHU7w',I=250000,b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)); async function key(p){let e=new TextEncoder(),k=await crypto.subtle.importKey('raw',e.encode(p),{name:'PBKDF2'},false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b(S),iterations:I,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])} async function data(){return(await Promise.all(F.map(f=>fetch(f,{cache:'no-store'}).then(r=>r.text())))).join('')} async function unzip(x){let ds=new DecompressionStream('gzip'),s=new Blob([x]).stream().pipeThrough(ds);return new Uint8Array(await new Response(s).arrayBuffer())} function sec(h,n){let i=h.indexOf('<h2>'+n+'</h2>');if(i<0)return null;let s=h.lastIndexOf('<section',i),e=h.indexOf('</section>',i);return s>=0&&e>=0?[s,e+10]:null} const C=`.cmp{display:grid;grid-template-columns:1fr 170px 1fr;gap:12px}.cc{border:1px solid var(--line);border-radius:18px;padding:17px;background:#fff}.cc.a{background:#f7f9ff;border-color:#bfd0f5}.cc.b{background:#fffaf1;border-color:#decda7}.ct{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:700;background:#e9efff;color:#294db7}.cc.b .ct{background:#f4e8cd;color:#7c5a19}.cc h3{font-size:18px;margin:8px 0 5px}.cc p,.cp{font-size:11.5px;color:var(--muted)}.mid{border-radius:18px;background:#0b1f33;color:#fff;padding:15px;text-align:center;display:flex;flex-direction:column;justify-content:center}.mid b{font-size:18px}.mid span{font-size:10.5px;color:#d3dee8}.rows{margin-top:12px;display:grid;gap:7px}.cr{display:grid;grid-template-columns:110px 1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}.cr>*{padding:9px 10px;font-size:10.8px}.cr strong{background:#f6f8fa}.cr div{border-right:1px solid var(--line)}.vr{margin-top:12px;padding:12px;border-radius:13px;background:#f3f7ff;border:1px solid #c9d5f1;color:#3f5571;font-size:11.5px}.vr b{color:#244ba8}.oz{margin-top:18px;border-radius:24px;background:linear-gradient(145deg,#071f33,#0d3656);padding:22px;color:#fff}.oh{display:grid;grid-template-columns:1fr 220px;gap:15px;margin-bottom:14px}.oh h2{color:#fff;margin:0 0 5px}.oh p{color:#cbd7e1;font-size:11.5px;margin:0}.on{border:1px solid rgba(255,255,255,.13);border-radius:12px;padding:10px;background:rgba(255,255,255,.05);font-size:10px;color:#d6e0e8}.og{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}.oc{background:#fff;color:var(--ink);border-radius:15px;padding:14px}.oc.f{grid-row:span 2;background:#fff4dc}.oc small{color:#8b671e;font-weight:700}.oc h3{font-size:14px;margin:5px 0}.oc p{font-size:10.5px;color:var(--muted);margin:0}.ob{margin-top:7px;padding-top:7px;border-top:1px dashed #dde3e8;font-size:10px;color:#526577}.oi{margin-top:7px;padding:6px 8px;border-radius:9px;background:#edf3ff;color:#294db7;font-size:10px;font-weight:700}@media(max-width:850px){.cmp,.oh{grid-template-columns:1fr}.og{grid-template-columns:1fr 1fr}.oc.f{grid-row:auto}}@media(max-width:600px){.cr{grid-template-columns:1fr}.og{grid-template-columns:1fr}}`; const CMP=`<section class="section"><div class="section-head"><div><h2>المقارنة التي تهم المؤسس</h2><p class="sub">الفرق في المجلس، حقوق المؤسس، دخول المستثمر، والمرحلة المؤسسية المستهدفة.</p></div></div><div class="cmp"><article class="cc a"><span class="ct">المساهمة المبسطة</span><h3>مرونة أعلى في التصميم</h3><p>تفصيل الإدارة والتعيين والعزل ونسب القرارات وقيود الأسهم في النظام الأساس.</p><div class="cp"><b>سلطان:</b> مساحة أوسع للمقعد والفئة والقرارات المحجوزة.</div></article><div class="mid"><small>الترجيح لرياح البن</small><b>المبسطة كمرحلة نضج</b><span>ثم الانتقال إلى مساهمة غير مدرجة عند قرب مستثمر مؤسسي أو سوق المال.</span></div><article class="cc b"><span class="ct">المساهمة غير المدرجة</span><h3>بنية مؤسسية أكثر انتظاماً</h3><p>مجلس إدارة إلزامي وهيكل مألوف أكثر للصناديق والمستشار المالي والصفقات.</p><div class="cp"><b>سلطان:</b> حماية مركزه ضمن إطار أكثر تنظيماً.</div></article></div><div class="rows"><div class="cr"><strong>المجلس</strong><div>المبسطة: مرونة في التعيين</div><div>غير المدرجة: مجلس إلزامي</div></div><div class="cr"><strong>المؤسس</strong><div>المبسطة: أدوات حماية أوسع</div><div>غير المدرجة: حماية ضمن إطار أكثر تقيداً</div></div><div class="cr"><strong>المستثمر</strong><div>المبسطة: أفضل للصفقة الخاصة</div><div>غير المدرجة: أكثر ألفة للمؤسسي</div></div><div class="cr"><strong>سوق المال</strong><div>المبسطة: مرحلة نضج</div><div>غير المدرجة: أقرب لمسار الإدراج</div></div></div><div class="vr"><b>الترجيح:</b> عندما يكون الإدراج أو المستثمر المؤسسي هدفاً متوسط المدى، تستفيد رياح البن من مرونة المساهمة المبسطة لبناء المجلس والصلاحيات وفئات الأسهم، ثم تنتقل لاحقاً إلى الشركة المساهمة غير المدرجة عند الحاجة.</div></section>`; const OFF=`<section class="oz"><div class="oh"><div><small style="color:#d6b56f">مرحلة ما بعد الدراسة</small><h2>من التحليل إلى مخرجات قابلة للاعتماد</h2><p>يمكن تطوير أي محور إلى مسار مستقل ينتهي بوثائق وقرارات قابلة للإحالة إلى فريق الشركة والمحامي ومستشار الحوكمة.</p></div><div class="on">نطاق كل مسار يحدد بعد مراجعة ما أنجزته الشركة ومستشاروها، حتى يكون العمل مكملاً لما هو قائم.</div></div><div class="og"><article class="oc f"><small>المسار الرئيسي</small><h3>هيكل التحول والحوكمة</h3><p>تجميع مركز سلطان، فئات الأسهم، المجلس، التصويت، نسب القرارات ودخول المستثمر في تصميم واحد.</p><div class="ob"><b>المخرجات:</b> خريطة حوكمة + نموذج المجلس + مصفوفة قرارات + تصور فئات الأسهم.</div><div class="oi">قبل اعتماد الصياغة النهائية للتحول</div></article><article class="oc"><small>01 · المؤسس</small><h3>سيناريوهات ملكية سلطان</h3><p>أثر الزيادة والبيع ودخول المستثمر.</p><div class="ob"><b>المخرج:</b> ملكية وتصويت + Dilution.</div></article><article class="oc"><small>02 · الصلاحيات</small><h3>مصفوفة المجلس والإدارة</h3><p>توزيع القرار والحدود المالية والتشغيلية.</p><div class="ob"><b>المخرج:</b> DoA + قرارات محجوزة.</div></article><article class="oc"><small>03 · المستثمر</small><h3>تصميم الدخول والخروج</h3><p>فئة المستثمر وحقوقه وآلية خروجه.</p><div class="ob"><b>المخرج:</b> تصور الصفقة + Tag/Drag.</div></article><article class="oc"><small>04 · النضج</small><h3>خارطة المرحلة التالية</h3><p>المجلس واللجان والتقارير والمخاطر على مراحل.</p><div class="ob"><b>المخرج:</b> خارطة 18-24 شهراً.</div></article></div></section>`; async function openStudy(){let m=document.getElementById('msg'),p=document.getElementById('pw').value.trim();m.textContent='جاري التحقق...';try{let[k,d]=await Promise.all([key(p),data()]),x=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(V)},k,b(d)),h=new TextDecoder().decode(await unzip(x));h=h.replaceAll('المساهمة الة','المساهمة المبسطة').replaceAll('شركة مساهمة ة','شركة مساهمة مبسطة').replaceAll('يمكن للة أن تتبنى','يمكن للمساهمة المبسطة أن تتبنى');let a=sec(h,'المقارنة التي تهم المؤسس');if(a)h=h.slice(0,a[0])+CMP+h.slice(a[1]);a=sec(h,'مسارات تطبيقية يمكن تطويرها عند الحاجة')||sec(h,'حزمة التنفيذ المقترحة');if(a)h=h.slice(0,a[0])+OFF+h.slice(a[1]);h=h.replace('</style>',C+'</style>');document.open();document.write(h);document.close()}catch(e){m.textContent='رمز الوصول غير صحيح.'}} go.onclick=openStudy;pw.onkeydown=e=>{if(e.key==='Enter')openStudy()}; </script></body></html>
