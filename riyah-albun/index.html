</div>\n  </div>\n  <div class=\"redeem-note\"><b>مثال لرياح البن:</b> يدخل مستثمر في فئة قابلة للاسترداد، وتنص شروط الإصدار على أنه عند تحقق نتائج مالية محددة خلال مدة معينة يجوز للشركة استرداد أسهمه وفق معادلة تقييم أو سعر استرداد متفق عليه مسبقاً. تأثير سلطان يأتي من حقوق الفئة (أ) ونسب القرارات، بينما يكون الاسترداد قراراً للشركة وفق شروط الإصدار.</div>\n </div>\n <div class=\"share-law-map\">\n  <div class=\"share-law\"><b>م108</b><span>أنواع الأسهم وفئاتها والحقوق المرتبطة بكل فئة.</span></div>\n  <div class=\"share-law\"><b>م142</b><span>طريقة إدارة المساهمة المبسطة والتعيين والعزل والصلاحيات.</span></div>\n  <div class=\"share-law\"><b>م145</b><span>نصاب اجتماعات المساهمين وأنصبة القرارات.</span></div>\n  <div class=\"share-law\"><b>اللائحة 51/53</b><span>ضوابط الأسهم الممتازة والقابلة للاسترداد.</span></div>\n </div>\n</section>";

fer72-item\"><i>✓</i><span><b>تصميم مجلس الإدارة:</b> المقاعد وطريقة التعيين أو الانتخاب والعزل والاستبدال.</span></div>\n    <div class=\"offer72-item\"><i>✓</i><span><b>مصفوفة القرار:</b> المساهمون ← المجلس ← الرئيس التنفيذي، مع نسب القرارات المحجوزة.</span></div>\n    <div class=\"offer72-item\"><i>✓</i><span><b>تصميم فئات الأسهم:</b> فئة المؤسس والفئة الاستثمارية وأي فئة خاصة لصفقة مستقبلية.</span></div>\n    <div class=\"offer72-item\"><i>✓</i><span><b>سيناريو دخول المستثمر:</b> شراء أسهم قائمة أو زيادة رأس المال أو إصدار فئة جديدة.</span></div>\n    <div class=\"offer72-item\"><i>✓</i><span><b>وثيقة تنفيذ:</b> توصيات محددة قابلة للإحالة للمحامي وفريق الحوكمة لإدراجها في الوثائق النظامية.</span></div>\n   </div>\n  </div>\n </div>\n <div class=\"offer72-result\"><b>القيمة التي تحصل عليها الشركة</b><span>قرار حوكمة متكامل قبل الصياغة: من يملك ماذا، من يعيّن من، من يصوت على ماذا، كيف يدخل المستثمر، وما الحقوق التي تبقى للمؤسس. هذا يقلل جولات المراجعة وإعادة صياغة النظام الأساس عند كل تغيير.</span></div>\n <div class=\"offer72-next\">\n  <article><b>مصفوفة الصلاحيات والمخاطر</b><span>حدود مالية وتشغيلية وسجل مخاطر حوكمة بعد اعتماد الهيكل.</span><em>مرحلة تالية</em></article>\n  <article><b>جاهزية المستثمر والصفقة</b><span>ورقة شروط حوكمية وحقوق الأولوية وTag Along وDrag Along وغرفة البيانات.</span><em>عند وجود مستثمر جاد</em></article>\n  <article><b>خارطة الجاهزية للسوق</b><span>برنامج نضج للمجلس واللجان والتقارير والمجلس الاستشاري وبوابات الانتقال.</span><em>للأفق المتوسط</em></article>\n </div>\n</section>";

  ];
  repairs.forEach(([a,b])=>html=html.split(a).join(b));

  html=html.split("الأسهم القابلة للاسترداد بلغة غير المختص").join("الأسهم القابلة للاسترداد");
  html=html.replace(/<h2>حزمة حلول عملية داخل المساهمة المبسطة<\/h2>/g,"<h2>حلول الحوكمة داخل شركة المساهمة المبسطة</h2>");
  html=html.replace(/<h2>هندسة القرار داخل المساهمة المبسطة<\/h2>/g,"<h2>هندسة القرار داخل شركة المساهمة المبسطة</h2>");

  if(!html.includes('id="offer-v72"')) html=html.replace("</head>",OFFER_CSS+"</head>");
  return html;
}
