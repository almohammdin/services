async function derive(pass,salt,iterations=310000){const m=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:from64(salt),iterations},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function encrypt(state,k=key){const iv=crypto.getRandomValues(new Uint8Array(12)),data=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:te.encode('jazrah/state/v1')},k,te.encode(JSON.stringify(state)));return{schema:'jazrah-vault-1',salt:sealed.salt,iterations:sealed.iterations,iv:to64(iv),data:to64(data)};}
async function decrypt(record){if(record.schema!=='jazrah-vault-1'||typeof record.salt!=='string'||record.salt.length>100||typeof record.iv!=='string'||record.iv.length>100||typeof record.data!=='string'||record.data.length>2000000||record.iterations!==310000)throw Error('invalid');const k=record.salt===sealed.salt?key:await derive(password,record.salt,record.iterations);return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(record.iv),additionalData:te.encode('jazrah/state/v1')},k,from64(record.data))));}
function download(name,text){const url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
window.jazrahVault={async load(){const text=localStorage.getItem(STORE);return text?decrypt(JSON.parse(text)):null;},save(state){const serial=JSON.stringify(state),mine=++revision,k=key;pendingSave=pendingSave.catch(()=>{}).then(async()=>{if(!k)throw Error('locked');const record=await encrypt(JSON.parse(serial),k);if(mine>savedRevision){localStorage.setItem(STORE,JSON.stringify(record));savedRevision=mine;}});return pendingSave;},async backup(state){if(!key)throw Error('locked');download('jazrah-followup.json',JSON.stringify(await encrypt(state)));},async restore(text){return decrypt(JSON.parse(text));},lock(){const frame=document.getElementById('app');frame.hidden=true;frame.srcdoc='';document.getElementById('gate').hidden=false;document.getElementById('password').value='';document.getElementById('status').textContent='قفل الملف. أدخل الرمز للمتابعة.';key=null;password=null;document.title='ملف حتى | دخول';document.getElementById('password').focus();}};
document.getElementById('login').onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('enter'),status=document.getElementById('status'),input=document.getElementById('password');btn.disabled=true;status.textContent='جار فتح الملف…';try{const pass=input.value,k=await derive(pass,sealed.salt,sealed.iterations),clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(sealed.iv),additionalData:te.encode('jazrah/content/v1')},k,from64(sealed.data));key=k;password=pass;const frame=document.getElementById('app');frame.srcdoc=td.decode(clear);frame.hidden=false;document.getElementById('gate').hidden=true;document.title='جزرة | تنظيم الشراكة';input.value='';status.textContent='';}catch{status.textContent='تحقق من رمز الدخول وأعد المحاولة.';input.focus();}finally{btn.disabled=false;}};})();
</script></body></html>
