(()=>{'use strict';const sealed=JSON.parse(document.getElementById('payload').textContent),te=new TextEncoder(),td=new TextDecoder(),from64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),to64=b=>{let s='';for(const c of new Uint8Array(b))s+=String.fromCharCode(c);return btoa(s);},STORE='hatta-jazrah-session-v1';let key=null,password=null,revision=0,savedRevision=0,pendingSave=Promise.resolve();

function download(name,text){const url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
window.jazrahVault={async load(){const text=localStorage.getItem(STORE);return text?decrypt(JSON.parse(text)):null;},save(state){const serial=JSON.stringify(state),mine=++revision,k=key;pendingSave=pendingSave.catch(()=>{}).then(async()=>{if(!k)throw Error('locked');const record=await encrypt(JSON.parse(serial),k);if(mine>savedRevision){localStorage.setItem(STORE,JSON.stringify(record));savedRevision=mine;}});return pendingSave;},async backup(state){if(!key)throw Error('locked');download('jazrah-followup.json',JSON.stringify(await encrypt(state)));},async restore(text){return decrypt(JSON.parse(text));},lock(){const frame=document.getElementById('app');frame.hidden=true;frame.srcdoc='';document.getElementById('gate').hidden=false;document.getElementById('password').value='';document.getElementById('status').textContent='قفل الملف. أدخل الرمز للمتابعة.';key=null;password=null;document.title='ملف حتى | دخول';document.getElementById('password').focus();}};
