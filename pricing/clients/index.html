<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>العملاء | لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#101828;--gold:#b59a55;--muted:#667085;--line:#d8dee8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f6f8fb,#edf2f7);font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;color:var(--navy);line-height:1.7}a{text-decoration:none;color:inherit}button,input,textarea{font:inherit}.shell{max-width:1120px;margin:auto;padding:20px}.top{background:linear-gradient(135deg,#101828,#263349);color:#fff;border-radius:28px;padding:22px;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{margin:0;font-size:28px}.top p{margin:6px 0 0;color:rgba(255,255,255,.74);font-size:13px}.btn{border:0;border-radius:14px;min-height:42px;padding:9px 14px;font-weight:900;background:#edf1f7;color:#101828;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.btn.gold{background:var(--gold)}.btn.dark{background:var(--navy);color:#fff}.grid{display:grid;grid-template-columns:340px 1fr;gap:14px;margin-top:14px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 12px 35px rgba(16,24,40,.06)}.field{margin-bottom:10px}.field label{display:block;font-size:12px;font-weight:900;color:#344054;margin-bottom:5px}input,textarea{width:100%;border:1px solid #cfd6e0;border-radius:13px;padding:10px 12px}textarea{min-height:100px}.list{display:grid;gap:10px}.client{border:1px solid #edf0f5;background:#fbfcfe;border-radius:18px;padding:14px;display:flex;justify-content:space-between;gap:12px}.client b{color:var(--navy)}.client small{display:block;color:var(--muted);margin-top:4px}.empty{border:1px dashed #cfd6e0;border-radius:18px;padding:18px;text-align:center;color:var(--muted);background:#fff}.notice{margin:14px 0;color:#475467;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:850px){.top,.grid{display:block}.top .actions{margin-top:12px}.card{margin-top:12px}}
</style>
</head>
<body><main class="shell">
<section class="top"><div><h1>العملاء</h1><p>لوحة التحكم ← العملاء · بيانات العملاء والعروض مرتبطة بحسابك.</p></div><div class="actions"><a class="btn gold" href="/services/pricing/tool/">عرض جديد</a><a class="btn" href="/services/pricing/offers/">العروض السابقة</a><a class="btn" href="/services/pricing/">لوحة التحكم</a></div></section>
<p id="message" class="notice">جارٍ تحميل بيانات الحساب…</p>
<section class="grid"><div class="card"><h2>إضافة عميل</h2><div class="field"><label for="cName">اسم العميل</label><input id="cName" autocomplete="organization"></div><div class="field"><label for="cPerson">الشخص المسؤول</label><input id="cPerson"></div><div class="field"><label for="cNotes">ملاحظات</label><textarea id="cNotes"></textarea></div><button class="btn dark" id="addBtn" style="width:100%">حفظ العميل</button></div><div class="card"><h2>قائمة العملاء</h2><div id="clients" class="list"></div></div></section>
</main>
<script type="module">
import {auth,authReady,onAuthStateChanged,signIn,loadWorkspace,saveClient,clientKey} from '../data.js';
const $=id=>document.getElementById(id),fmt=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
let user=null,clients=[],quotes=[];
function message(text,login=false){$('message').innerHTML=esc(text)+(login?' <button class="btn gold" id="loginBtn">الدخول بحساب Google</button>':'');if(login)$('loginBtn').onclick=()=>signIn().catch(()=>message('تعذر تسجيل الدخول. تحقق من الحساب المصرح له.',true))}
function render(){
 const map=new Map(clients.map(c=>[clientKey(c.name),{...c,count:0,value:0}]));
 for(const q of quotes){const key=clientKey(q.client);if(!key)continue;const c=map.get(key)||{name:q.client,count:0,value:0};c.count++;c.value+=Number(q.amount)||0;map.set(key,c)}
 const rows=[...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'ar'));
 $('clients').innerHTML=rows.map(c=>'<div class="client"><div><b>'+esc(c.name)+'</b><small>'+esc(c.person||'—')+' · '+fmt.format(c.count||0)+' عروض</small><small>'+esc(c.notes||'')+'</small></div><div>'+fmt.format(c.value||0)+' ر.س</div></div>').join('')||'<div class="empty">لا يوجد عملاء بعد.</div>';
}
$('addBtn').onclick=async()=>{
 if(!user){message('سجل دخولك قبل حفظ العميل.',true);return}
 const name=$('cName').value.trim();if(!name){$('cName').focus();return}
 $('addBtn').disabled=true;
 try{clients=await saveClient(user,{name,person:$('cPerson').value.trim(),notes:$('cNotes').value.trim()},clients);$('cName').value='';$('cPerson').value='';$('cNotes').value='';message('تم حفظ العميل، وسيظهر في أداة التسعير.');render()}
 catch(e){console.error(e);message('تعذر حفظ العميل سحابيًا. لم تُفقد البيانات المدخلة.')}
 finally{$('addBtn').disabled=false}
};
await authReady.catch(console.error);
onAuthStateChanged(auth,async u=>{
 user=u;
 if(!u){clients=[];quotes=[];render();message('سجّل دخولك بحساب Google لعرض عملائك.',true);return}
 try{const workspace=await loadWorkspace(u);clients=workspace.clients;quotes=workspace.quotes;render();message('العملاء والعروض محدثة من حسابك السحابي.')}
 catch(e){console.error(e);message('تعذر تحميل بيانات الحساب. حاول تحديث الصفحة.')}
});
</script></body></html>
