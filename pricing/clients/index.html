<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>العملاء | التسعير</title><link rel="apple-touch-icon" href="/services/pricing/apple-touch-icon.png?v=20260913"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--ink:#101828;--muted:#667085;--line:#d8dee8;--navy:#101828;--gold:#b59a55;--shadow:0 18px 50px rgba(16,24,40,.10)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f6f8fb,#edf2f7);font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;color:var(--ink);line-height:1.7}a{text-decoration:none;color:inherit}button,input,textarea{font:inherit}.shell{max-width:1120px;margin:auto;padding:20px}.top{background:linear-gradient(135deg,#101828,#263349);color:#fff;border-radius:28px;padding:22px;display:flex;justify-content:space-between;gap:12px;align-items:center;box-shadow:var(--shadow)}h1{margin:0;font-size:28px}.top p{margin:6px 0 0;color:rgba(255,255,255,.74);font-size:13px}.btn{border:0;border-radius:14px;min-height:42px;padding:9px 14px;font-weight:900;background:#edf1f7;color:#101828;display:inline-flex;align-items:center;justify-content:center}.btn.gold{background:var(--gold)}.btn.dark{background:var(--navy);color:#fff}.grid{display:grid;grid-template-columns:340px 1fr;gap:14px;margin-top:14px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 12px 35px rgba(16,24,40,.06)}.field{margin-bottom:10px}.field label{display:block;font-size:12px;font-weight:900;color:#344054;margin-bottom:5px}input,textarea{width:100%;border:1px solid #cfd6e0;border-radius:13px;padding:10px 12px}textarea{min-height:100px}.list{display:grid;gap:10px}.client{border:1px solid #edf0f5;background:#fbfcfe;border-radius:18px;padding:14px;display:flex;justify-content:space-between;gap:12px}.client b{color:var(--navy)}.client small{display:block;color:var(--muted);margin-top:4px}.empty{border:1px dashed #cfd6e0;border-radius:18px;padding:18px;text-align:center;color:var(--muted);background:#fff}@media(max-width:850px){.top,.grid{display:block}.top .actions{margin-top:12px}.card{margin-top:12px}}</style></head><body><main class="shell"><section class="top"><div><h1>العملاء</h1><p>هنا مكان العملاء والمتابعة، وليس داخل صفحة التسعير.</p></div><div class="actions"><a class="btn gold" href="/services/pricing/tool/">الدخول للتسعير</a> <a class="btn" href="/services/pricing/">لوحة التحكم</a></div></section><section class="grid"><div class="card"><h2>إضافة عميل</h2><div class="field"><label>اسم العميل</label><input id="cName" placeholder="مثال: مؤسسة مطعم جزرة"></div><div class="field"><label>الشخص المسؤول</label><input id="cPerson" placeholder="اسم جهة التواصل"></div><div class="field"><label>ملاحظات</label><textarea id="cNotes"></textarea></div><button class="btn dark" id="addBtn" style="width:100%">حفظ العميل</button></div><div class="card"><h2>قائمة العملاء</h2><div id="clients" class="list"></div></div></section></main><script>const KEY='pricing_clients_v1',fmt=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}function offers(){const rows=[];for(const k of ['pricingTool_v1_cache','naif_service_pricing_crm_v1','services_pricing_unified_v7']){try{const raw=localStorage.getItem(k);if(!raw)continue;const d=JSON.parse(raw);(Array.isArray(d)?d:(d.quotes||d.records||[])).forEach(x=>rows.push(x))}catch(e){}}return rows}function manual(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function render(){const map=new Map();offers().forEach(r=>{const n=r.client||r.clientName||r.company;if(!n)return;const x=map.get(n)||{name:n,count:0,value:0,notes:''};x.count++;x.value+=Number(r.amount||r.value||r.quoteAmount)||0;map.set(n,x)});manual().forEach(c=>{map.set(c.name,{...(map.get(c.name)||{count:0,value:0}),...c})});const list=[...map.values()];clients.innerHTML=list.map(c=>`<div class="client"><div><b>${esc(c.name)}</b><small>${esc(c.person||'—')} · ${fmt.format(c.count||0)} عروض</small><small>${esc(c.notes||'')}</small></div><div>${fmt.format(c.value||0)}</div></div>`).join('')||'<div class="empty">لا توجد بيانات عملاء بعد.</div>'}addBtn.onclick=()=>{const name=cName.value.trim();if(!name)return;const rows=manual().filter(x=>x.name!==name);rows.unshift({name,person:cPerson.value.trim(),notes:cNotes.value.trim()});localStorage.setItem(KEY,JSON.stringify(rows));cName.value='';cPerson.value='';cNotes.value='';render()};render();</script></body></html>
