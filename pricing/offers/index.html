<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>العروض السابقة | لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#101828;--gold:#b59a55;--line:#d8dee8;--muted:#667085}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f6f8fb,#edf2f7);font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;color:var(--navy);line-height:1.7}a{text-decoration:none;color:inherit}button,input{font:inherit}.shell{max-width:1180px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#101828,#263349);color:#fff;border-radius:28px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:14px}h1{margin:0;font-size:28px}.hero p{margin:5px 0;color:#cbd5e1;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;border:0;border-radius:13px;background:#edf1f7;color:#101828;font-weight:900;min-height:40px;cursor:pointer}.btn.gold{background:var(--gold)}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:14px;box-shadow:0 12px 35px rgba(16,24,40,.06)}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center}.toolbar input{width:min(360px,100%);border:1px solid #cfd6e0;border-radius:13px;padding:9px 12px}.stats{display:flex;gap:16px;color:var(--muted);font-size:13px}.stats b{color:var(--navy);font-size:17px}.scroll{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f5;text-align:right}.table th{background:#f8fafc;color:#475467}.empty{padding:25px;text-align:center;color:var(--muted)}.notice{font-size:13px;color:var(--muted)}@media(max-width:750px){.hero,.toolbar{display:block}.actions,.toolbar input{margin-top:12px}.stats{margin-top:12px}}
</style><style>.group-row td{background:#eaf0f8;border-top:2px solid #d8dee8;font-weight:800}.group-row small{color:var(--muted);font-weight:500;margin-inline-start:10px}.version-label{display:block;color:var(--muted);font-size:11px}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.btn.danger{background:#fff1f2;color:#9f1239}.btn:disabled{opacity:.55;cursor:wait}@media(max-width:750px){.row-actions{min-width:145px}}</style>
<style>body:not(.ready) .shell{display:none}.ready .auth{display:none}.auth{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#101828,#263349)}.auth-card{width:min(410px,100%);padding:28px;border-radius:26px;background:#fff;text-align:center;box-shadow:0 26px 65px rgba(0,0,0,.22)}.auth-card h1{font-size:24px}.auth-card p{font-size:13px;color:var(--muted)}.auth-card .btn{width:100%;margin-top:12px}.auth-message{min-height:24px;color:#b42318;font-size:12px}</style></head>
<body><section class="auth"><div class="auth-card"><h1>العروض</h1><p>سجّل الدخول للوصول إلى عروضك.</p><button class="btn gold" id="authLoginBtn" type="button">الدخول بحساب Google</button><div class="auth-message" id="authMessage" role="status"></div><a class="btn" href="/services/pricing/">لوحة التحكم</a></div></section><main class="shell">
<header class="hero"><div><h1>العروض</h1></div><nav class="actions" aria-label="أقسام التسعير"><a class="btn" href="/services/pricing/">لوحة التحكم</a><a class="btn gold" href="/services/pricing/tool/">عرض جديد</a><a class="btn" href="/services/pricing/clients/">العملاء</a></nav></header>
<section class="card"><div class="toolbar"><div class="stats"><span>إجمالي العروض: <b id="total">0</b></span><span>المعتمدة: <b id="won">0</b></span></div><input id="search" type="search" placeholder="ابحث باسم العميل أو رقم العرض"></div><p id="message" class="notice">جارٍ تحميل العروض…</p><div class="scroll"><table class="table"><thead><tr><th>العميل والنسخة</th><th>رقم العرض</th><th>الخدمة</th><th>القيمة</th><th>الحالة</th><th>الإرسال والمتابعة</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main>
<script type="module">
import {auth,authReady,onAuthStateChanged,signIn,loadWorkspace,deleteQuoteVersion,quoteKey,quoteSeriesKey,quoteVersion,serviceLabel,quoteFinances} from '../data.js?v=20260926b';
const $=id=>document.getElementById(id),fmt=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
let quotes=[],user=null;
$('authLoginBtn').onclick=async()=>{try{$('authMessage').textContent='';await signIn()}catch(e){console.error(e);$('authMessage').textContent='تعذر تسجيل الدخول. حاول مرة أخرى.'}};
function render(){
 const query=$('search').value.trim().toLocaleLowerCase('ar');
 const map=new Map();for(const q of quotes){const key=quoteSeriesKey(q);if(!map.has(key))map.set(key,[]);map.get(key).push(q)}
 const groups=[...map.values()].map(versions=>versions.sort((a,b)=>quoteVersion(b)-quoteVersion(a)||String(b.updatedAtIso||'').localeCompare(String(a.updatedAtIso||'')))).sort((a,b)=>String(b[0].updatedAtIso||'').localeCompare(String(a[0].updatedAtIso||'')));
 const filtered=groups.filter(versions=>versions.some(q=>(String(q.client||'')+' '+String(q.quoteNo||'')+' '+serviceLabel(q)).toLocaleLowerCase('ar').includes(query)));
 $('total').textContent=fmt.format(groups.length);$('won').textContent=fmt.format(groups.filter(versions=>versions[0].status==='مقبول').length);
 $('rows').innerHTML=filtered.map(versions=>{
  const latest=versions[0];
  const head='<tr class="group-row"><td colspan="7">'+esc(latest.client||'—')+' · '+esc(serviceLabel(latest))+' <small>'+fmt.format(versions.length)+' '+(versions.length===1?'نسخة':'نسخ')+'</small></td></tr>';
  const items=versions.map(q=>{const finance=quoteFinances(q);return '<tr><td><span class="version-label">النسخة '+fmt.format(quoteVersion(q))+'</span>'+esc(q.client||'—')+'</td><td dir="ltr">'+esc(q.quoteNo||'—')+'</td><td>'+esc(serviceLabel(q))+'</td><td>'+fmt.format(finance.amount)+' ر.س'+(finance.partnerCost===null?'':'<span class="version-label">الشركاء: '+fmt.format(finance.partnerCost)+' · لك: '+fmt.format(finance.ownShare)+'</span>')+'</td><td>'+esc(q.status||'مسودة')+(q.status==='مقبول'?'<span class="version-label">التنفيذ: '+esc(q.executionStatus||'بانتظار المتطلبات')+'</span>':'')+(q.sentVia?'<span class="version-label">أُرسل عبر '+esc(q.sentVia)+'</span>':'')+'</td><td>'+esc(q.sentAt||String(q.updatedAtIso||'').slice(0,10)||'—')+(q.nextDate?'<span class="version-label">متابعة: '+esc(q.nextDate)+'</span>':'')+(finance.collected===null?'':'<span class="version-label">المحصّل: '+fmt.format(finance.collected)+' ر.س</span>')+'</td><td><div class="row-actions"><a class="btn gold" href="/services/pricing/tool/?quote='+encodeURIComponent(quoteKey(q))+'">فتح</a><button class="btn danger" type="button" data-delete-quote="'+esc(quoteKey(q))+'">حذف</button></div></td></tr>'}).join('');
  return head+items;
 }).join('')||'<tr><td colspan="7" class="empty">لا توجد عروض مطابقة.</td></tr>';
}
$('search').oninput=render;
$('rows').onclick=async e=>{
 const button=e.target.closest('[data-delete-quote]');if(!button||!user)return;
 const id=button.dataset.deleteQuote,q=quotes.find(row=>quoteKey(row)===id);if(!q)return;
 if(!confirm('هل تريد حذف النسخة '+quoteVersion(q)+' من عرض «'+(q.client||'العميل')+'»؟ لا يمكن استعادتها بعد الحذف.'))return;
 button.disabled=true;
 try{quotes=await deleteQuoteVersion(user,id);render();$('message').textContent='حُذفت النسخة المحددة فقط، وبقيت النسخ الأخرى محفوظة.'}
 catch(error){console.error(error);button.disabled=false;$('message').textContent='تعذر حذف النسخة. حدّث الصفحة وحاول مجددًا.'}
};
const requestedClient=new URLSearchParams(location.search).get('client');if(requestedClient)$('search').value=requestedClient;
await authReady.catch(console.error);
onAuthStateChanged(auth,async account=>{
 user=account;document.body.classList.toggle('ready',Boolean(account));
 if(!account){quotes=[];render();$('message').textContent='';return}
 try{quotes=(await loadWorkspace(account)).quotes;render();$('message').textContent=''}
 catch(e){console.error(e);$('message').textContent='تعذر تحميل العروض. حاول تحديث الصفحة.'}
});
</script></body></html>
