<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>العروض السابقة | لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#101828;--gold:#b59a55;--line:#d8dee8;--muted:#667085}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f6f8fb,#edf2f7);font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;color:var(--navy);line-height:1.7}a{text-decoration:none;color:inherit}button,input{font:inherit}.shell{max-width:1180px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#101828,#263349);color:#fff;border-radius:28px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:14px}h1{margin:0;font-size:28px}.hero p{margin:5px 0;color:#cbd5e1;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;border:0;border-radius:13px;background:#edf1f7;font-weight:900;min-height:40px;cursor:pointer}.btn.gold{background:var(--gold)}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:14px;box-shadow:0 12px 35px rgba(16,24,40,.06)}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center}.toolbar input{width:min(360px,100%);border:1px solid #cfd6e0;border-radius:13px;padding:9px 12px}.stats{display:flex;gap:16px;color:var(--muted);font-size:13px}.stats b{color:var(--navy);font-size:17px}.scroll{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f5;text-align:right}.table th{background:#f8fafc;color:#475467}.empty{padding:25px;text-align:center;color:var(--muted)}.notice{font-size:13px;color:var(--muted)}@media(max-width:750px){.hero,.toolbar{display:block}.actions,.toolbar input{margin-top:12px}.stats{margin-top:12px}}
</style></head>
<body><main class="shell">
<header class="hero"><div><h1>العروض السابقة</h1><p>لوحة التحكم ← العروض السابقة · افتح أي عرض لاستكماله في أداة التسعير.</p></div><nav class="actions"><a class="btn gold" href="/services/pricing/tool/">عرض جديد</a><a class="btn" href="/services/pricing/clients/">العملاء</a><a class="btn" href="/services/pricing/">لوحة التحكم</a></nav></header>
<section class="card"><div class="toolbar"><div class="stats"><span>إجمالي العروض: <b id="total">0</b></span><span>المعتمدة: <b id="won">0</b></span></div><input id="search" type="search" placeholder="ابحث باسم العميل أو رقم العرض"></div><p id="message" class="notice">جارٍ تحميل العروض…</p><div class="scroll"><table class="table"><thead><tr><th>العميل</th><th>رقم العرض</th><th>الخدمة</th><th>القيمة</th><th>الحالة</th><th>آخر تحديث</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main>
<script type="module">
import {auth,authReady,onAuthStateChanged,signIn,loadWorkspace} from '../data.js';
const $=id=>document.getElementById(id),fmt=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
let quotes=[];
function render(){
 const query=$('search').value.trim().toLocaleLowerCase('ar');
 const filtered=quotes.filter(q=>(String(q.client||'')+' '+String(q.quoteNo||'')).toLocaleLowerCase('ar').includes(query));
 $('total').textContent=fmt.format(quotes.length);$('won').textContent=fmt.format(quotes.filter(q=>q.status==='مقبول').length);
 $('rows').innerHTML=filtered.map(q=>'<tr><td><b>'+esc(q.client||'—')+'</b></td><td dir="ltr">'+esc(q.quoteNo||'—')+'</td><td>'+esc(q.serviceName||q.service||'—')+'</td><td>'+fmt.format(Number(q.amount)||0)+' ر.س</td><td>'+esc(q.status||'مسودة')+'</td><td>'+esc(String(q.updatedAtIso||'').slice(0,10)||'—')+'</td><td><a class="btn gold" href="/services/pricing/tool/?quote='+encodeURIComponent(q.id||q.quoteNo||'')+'">فتح</a></td></tr>').join('')||'<tr><td colspan="7" class="empty">لا توجد عروض مطابقة.</td></tr>';
}
$('search').oninput=render;
await authReady.catch(console.error);
onAuthStateChanged(auth,async user=>{
 if(!user){quotes=[];render();$('message').innerHTML='سجّل الدخول بحساب Google لعرض عروضك. <button class="btn gold" id="loginBtn">تسجيل الدخول</button>';$('loginBtn').onclick=()=>signIn().catch(()=>{$('message').textContent='تعذر تسجيل الدخول. تحقق من الحساب المصرح له.'});return}
 try{quotes=(await loadWorkspace(user)).quotes.sort((a,b)=>String(b.updatedAtIso||'').localeCompare(String(a.updatedAtIso||'')));render();$('message').textContent='العروض المعروضة محفوظة في حسابك السحابي.'}
 catch(e){console.error(e);$('message').textContent='تعذر تحميل العروض. حاول تحديث الصفحة.'}
});
</script></body></html>
