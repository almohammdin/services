<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#061f56">
  <title>حتى لحلول الأعمال — الحوكمة وتطوير الأعمال</title>
  <style>
    html,body{margin:0;min-height:100%;background:#fbfaf7;color:#17233c;font-family:Tahoma,Arial,sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;background:#061f56;color:#fff}
    .loading b{color:#d2a05a}
  </style>
</head>
<body>
  <div class="loading"><div><b>حتى لحلول الأعمال</b><br>جاري تحميل خدمات الحوكمة وتطوير الأعمال…</div></div>
  <script>
  (async function(){
    const serviceUrl=new URL('../index-source.html',location.href);
    const guideUrl=new URL('/hatta-brand-guide/',location.origin);

    function absoluteAssetUrls(doc,base){
      doc.querySelectorAll('[src],[href]').forEach(function(el){
        ['src','href'].forEach(function(attr){
          const value=el.getAttribute(attr);
          if(!value || /^(?:#|data:|mailto:|tel:|https?:|\/\/|\/)/i.test(value)) return;
          try{el.setAttribute(attr,new URL(value,base).href);}catch(e){}
        });
      });
    }

    function setImage(container,src,alt){
      if(!container || !src) return;
      container.textContent='';
      const img=document.createElement('img');
      img.src=src;
      img.alt=alt;
      container.appendChild(img);
    }

    try{
      const responses=await Promise.all([
        fetch(serviceUrl,{cache:'no-store'}),
        fetch(guideUrl,{cache:'no-store'})
      ]);
      if(!responses[0].ok || !responses[1].ok) throw new Error('تعذر تحميل المصدر أو دليل الهوية');

      const texts=await Promise.all([responses[0].text(),responses[1].text()]);
      const doc=new DOMParser().parseFromString(texts[0],'text/html');
      const guide=new DOMParser().parseFromString(texts[1],'text/html');
      absoluteAssetUrls(doc,new URL('../',location.href));

      const guideCss=Array.from(guide.querySelectorAll('style')).map(function(s){return s.textContent||'';}).join('\n');
      const roots=(guideCss.match(/:root\s*\{[\s\S]*?\}/g)||[]).filter(function(block){
        return /--navy\s*:|--frame-light\s*:/.test(block);
      }).join('\n');
      const faces=(guideCss.match(/@font-face\s*\{[\s\S]*?\}/g)||[]).filter(function(block){
        return /Hatta Mada|IBM Plex Sans Arabic|El Messiri/i.test(block);
      }).join('\n');

      doc.querySelectorAll('link[href*="fonts.googleapis.com"],link[href*="fonts.gstatic.com"]').forEach(function(el){el.remove();});
      Array.from(guide.querySelectorAll('link[rel="stylesheet"]')).forEach(function(link){
        const href=link.getAttribute('href')||'';
        if(!/fonts\.googleapis\.com/i.test(href)) return;
        const copy=doc.createElement('link');
        copy.rel='stylesheet';
        copy.href=new URL(href,guideUrl).href;
        doc.head.appendChild(copy);
      });

      const markLogo=(guide.querySelector('.mini-brand img')||{}).src || (guide.querySelector('.mini-brand img')||{}).getAttribute?.('src') || '';
      const fullLogo=(guide.querySelector('.cover-logo img')||{}).src || (guide.querySelector('.cover-logo img')||{}).getAttribute?.('src') || markLogo;

      doc.title='حتى لحلول الأعمال — الحوكمة وتطوير الأعمال';
      doc.body.classList.add('hatta-version');
      const titleMeta=doc.querySelector('meta[property="og:title"]');
      if(titleMeta) titleMeta.setAttribute('content','حتى لحلول الأعمال — الحوكمة وتطوير الأعمال');
      let theme=doc.querySelector('meta[name="theme-color"]');
      if(!theme){theme=doc.createElement('meta');theme.name='theme-color';doc.head.appendChild(theme);}
      theme.setAttribute('content','#061f56');
      const canonical=doc.querySelector('link[rel="canonical"]');
      if(canonical) canonical.setAttribute('href',location.href);

      const brandStrong=doc.querySelector('.brand-title strong');
      const brandSub=doc.querySelector('.brand-title span');
      if(brandStrong) brandStrong.textContent='حتى لحلول الأعمال';
      if(brandSub) brandSub.textContent='الحوكمة وتطوير الأعمال';
      setImage(doc.querySelector('.mark'),markLogo,'علامة حتى');
      setImage(doc.querySelector('.side-mark'),fullLogo,'شعار حتى لحلول الأعمال');
      const kicker=doc.querySelector('.hero .kicker');
      if(kicker) kicker.textContent='حتى لحلول الأعمال';
      const footerStrong=doc.querySelector('.footer strong');
      if(footerStrong) footerStrong.textContent='حتى لحلول الأعمال — الحوكمة وتطوير الأعمال.';

      const identityStyle=doc.createElement('style');
      identityStyle.id='hatta-brand-identity';
      identityStyle.textContent=`
${faces}
:root{
  --navy:#061f56;--navy2:#0b2f75;--gold:#b47a2d;--gold2:#d2a05a;
  --sand:#e6d2ae;--paper:#fbfaf7;--ink:#17233c;--muted:#657084;
  --white:#fff;--line:rgba(6,31,86,.13);--danger:#b42318;--green:#087a55;
  --radius:26px;--shadow:0 24px 70px rgba(6,31,86,.12);
}
${roots}
:root{
  --night:var(--navy);--night2:var(--navy2);--purple:var(--navy);--purple2:var(--navy2);
  --coral:var(--gold);--cream:var(--paper);--text:var(--ink);--good:var(--green);--warn:var(--gold2);
}
html{scroll-behavior:smooth;background:var(--paper)}
body,.site{background:var(--paper)!important;color:var(--ink)!important;font-family:"IBM Plex Sans Arabic","Hatta Mada",Tahoma,Arial,sans-serif!important}
button,input,textarea,select{font-family:"IBM Plex Sans Arabic","Hatta Mada",Tahoma,Arial,sans-serif!important}
.en,[lang="en"],[dir="ltr"]{font-family:"El Messiri",Arial,sans-serif!important}
h1,h2,h3,h4,.brand-title strong,.kicker,.btn{font-family:"Hatta Mada","IBM Plex Sans Arabic",sans-serif!important}
.wrap{width:min(1180px,calc(100% - 40px))!important;margin-inline:auto!important}
.topbar{height:74px!important;background:rgba(251,250,247,.94)!important;border-bottom:1px solid var(--line)!important;box-shadow:none!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.nav{min-height:74px!important}
.brand{gap:13px!important}
.mark{width:48px!important;height:48px!important;border-radius:14px!important;background:#fff!important;border:1px solid var(--line)!important;box-shadow:0 10px 28px rgba(6,31,86,.08)!important;overflow:hidden!important;padding:7px!important;display:grid!important;place-items:center!important;color:transparent!important}
.mark img{display:block!important;width:100%!important;height:100%!important;object-fit:contain!important}
.brand-title strong{color:var(--navy)!important;font-size:18px!important;font-weight:800!important;line-height:1.25!important}
.brand-title span{color:var(--muted)!important}
.social-icon{border-color:var(--line)!important;color:var(--navy)!important;background:#fff!important}
.btn{border-radius:999px!important;font-weight:700!important;letter-spacing:0!important}
.btn.primary{background:var(--navy)!important;color:#fff!important;border-color:var(--navy)!important;box-shadow:none!important}
.btn.primary:hover{background:var(--navy2)!important;border-color:var(--navy2)!important;transform:translateY(-1px)}
.hero{position:relative!important;overflow:hidden!important;background-color:var(--navy)!important;background-image:var(--frame-dark,none),var(--frame-dark-opposite,none),radial-gradient(circle at 18% 22%,rgba(210,160,90,.16),transparent 30%),radial-gradient(circle at 82% 74%,rgba(255,255,255,.08),transparent 28%)!important;background-repeat:no-repeat!important;background-position:left top,right bottom,center,center!important;background-size:min(42vw,590px) auto,min(42vw,590px) auto,auto,auto!important;color:#fff!important}
.hero:before,.hero:after{display:none!important}
.hero-grid{grid-template-columns:1.05fr .95fr!important;gap:70px!important;padding:90px 0!important;align-items:center!important}
.kicker{color:var(--gold2)!important;font-size:13px!important;font-weight:700!important;letter-spacing:.01em!important;display:flex!important;align-items:center!important;gap:10px!important}
.kicker:before{content:"";width:24px;height:2px;background:currentColor;display:inline-block;border-radius:3px}
.hero h1{font-family:"Hatta Mada","IBM Plex Sans Arabic",sans-serif!important;font-size:clamp(44px,6.4vw,82px)!important;line-height:1.08!important;letter-spacing:-.02em!important;font-weight:800!important;color:#fff!important;margin-top:18px!important}
.hero p{color:#dfe6f3!important;font-size:18px!important;line-height:1.95!important;max-width:690px!important}
.hero .btn.secondary{background:transparent!important;color:#fff!important;border-color:rgba(255,255,255,.28)!important}
.hero-points{color:#dfe6f3!important}
.hero-points i{background:var(--gold2)!important}
.hero-panel{background:#fff!important;color:var(--ink)!important;border:1px solid rgba(255,255,255,.28)!important;border-radius:34px!important;box-shadow:0 30px 80px rgba(0,0,0,.24)!important;overflow:hidden!important}
.hero-panel-inner{background-image:var(--frame-light-opposite,none)!important;background-repeat:no-repeat!important;background-position:right bottom!important;background-size:68% auto!important}
.hero-panel h3{color:var(--navy)!important;font-family:"Hatta Mada","IBM Plex Sans Arabic",sans-serif!important}
.hero-panel p,.hero-panel li{color:var(--muted)!important}
.side-mark{width:min(250px,78%)!important;height:auto!important;min-height:92px!important;background:#fff!important;border:1px solid var(--line)!important;border-radius:20px!important;padding:14px!important;display:grid!important;place-items:center!important;color:transparent!important}
.side-mark img{display:block!important;width:100%!important;max-height:105px!important;object-fit:contain!important}
.section{padding:92px 0!important;border-top:1px solid var(--line)!important;background:var(--paper)!important}
.section.soft{background:#fff!important}
.section-head{display:grid!important;grid-template-columns:1fr minmax(260px,440px)!important;gap:48px!important;align-items:end!important;margin-bottom:48px!important}
.section-head h2{font-family:"Hatta Mada","IBM Plex Sans Arabic",sans-serif!important;font-size:clamp(32px,4vw,52px)!important;line-height:1.25!important;color:var(--navy)!important;margin:0!important}
.section-head p{color:var(--muted)!important;font-size:16px!important;line-height:1.9!important}
.problem,.step,.service{background:#fff!important;border:1px solid var(--line)!important;border-radius:var(--radius)!important;box-shadow:0 12px 38px rgba(6,31,86,.06)!important}
.problem.visual{background-color:var(--navy)!important;color:#fff!important;background-image:var(--frame-dark,none),var(--frame-dark-opposite,none)!important;background-repeat:no-repeat!important;background-position:left top,right bottom!important;background-size:74% auto!important}
.problem.visual h3,.problem.visual strong{color:#fff!important}
.problem.visual p{color:#dfe6f3!important}
.step b,.service h3,.problem h3{color:var(--navy)!important}
.step:before,.service:before{color:var(--gold)!important}
.footer{background-color:var(--navy)!important;color:#dfe6f3!important;border-top:0!important;background-image:var(--frame-dark,none),var(--frame-dark-opposite,none)!important;background-repeat:no-repeat!important;background-position:left top,right bottom!important;background-size:min(34vw,430px) auto!important}
.footer strong{color:#fff!important;font-family:"Hatta Mada","IBM Plex Sans Arabic",sans-serif!important}
.footer a{color:#fff!important}
@media(max-width:960px){
  .hero-grid,.section-head{grid-template-columns:1fr!important;gap:38px!important}
  .hero-grid{padding:72px 0!important}
  .hero{background-size:78vw auto,78vw auto,auto,auto!important}
}
@media(max-width:620px){
  .wrap{width:min(100% - 26px,1180px)!important}
  .topbar{height:auto!important}.nav{min-height:68px!important}
  .mark{width:42px!important;height:42px!important}.brand-title span{display:none!important}
  .hero-grid{padding:58px 0!important;gap:30px!important}
  .hero h1{font-size:clamp(38px,12vw,58px)!important}
  .hero p{font-size:16px!important}
  .section{padding:70px 0!important}.section-head{gap:18px!important;margin-bottom:34px!important}
  .hero-panel{border-radius:24px!important}
}
      `;
      doc.head.appendChild(identityStyle);

      document.open();
      document.write('<!doctype html>\n'+doc.documentElement.outerHTML);
      document.close();
    }catch(err){
      document.body.innerHTML='<div class="loading"><div><b>حتى لحلول الأعمال</b><br>تعذر تحميل النسخة حاليا.<br><a style="color:#fff" href="../">فتح النسخة الأساسية</a></div></div>';
    }
  })();
  </script>
</body>
</html>
