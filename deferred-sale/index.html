<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute"><symbol id="sar-mark" viewBox="0 0 1124 1256"><path d="M700 1113c-20 44-33 93-38 143l425-90c20-45 33-93 38-144l-425 91Z"/><path d="M1086 896c20-45 33-93 38-144l-331 70V688l292-62c20-45 33-94 38-144l-330 70V66c-51 28-96 66-132 111v403l-132 28V0c-51 28-96 66-132 111v526L101 700c-20 44-33 93-38 143l334-71v170l-358 76c-20 45-33 93-38 144l375-80c31-6 57-24 74-49l69-102c7-10 11-23 11-37V744l132-28v270l424-90Z"/></symbol></svg>
<main class="shell">
  <div class="bismillah">بسم الله الرحمن الرحيم</div>
  <header class="top">
    <div class="title-wrap"><span class="eyebrow">للبائع أو الممول</span><h1>حاسبة ربح البيع الآجل</h1></div>
  </header>
  <div class="workspace">
    <section class="panel" aria-labelledby="calc-title">
      <div class="panel-head"><h2 id="calc-title">بيانات العملية</h2><p>أدخل القيمة النقدية والثمن الآجل وجدول السداد.</p></div>
      <form class="form" id="calculator">
        <div class="fields">
          <div class="field full"><label for="product">اسم المنتج</label><div class="input-wrap"><input id="product" type="text" placeholder="مثال: زيت، مواشي، أسهم…" autocomplete="off" style="direction:rtl;text-align:right;padding-left:14px"></div></div>
          <div class="field"><label for="cash">قيمة المنتج نقدا</label><div class="input-wrap"><input class="money-input" id="cash" type="text" value="150,000" inputmode="numeric"><span class="suffix"><svg class="sar-icon"><use href="#sar-mark"></use></svg></span></div></div>
          <div class="field"><label for="deferred">سعر البيع الآجل</label><div class="input-wrap"><input class="money-input" id="deferred" type="text" value="200,000" inputmode="numeric"><span class="suffix"><svg class="sar-icon"><use href="#sar-mark"></use></svg></span></div></div>
          <div class="field"><label for="duration">مدة السداد</label><div class="duration-control"><div class="input-wrap"><input id="duration" type="number" min="0.1" max="360" step="0.5" value="3" inputmode="decimal" style="padding-left:14px"></div><select id="durationUnit" aria-label="وحدة مدة السداد"><option value="years" selected>سنوات</option><option value="months">أشهر</option></select></div><div class="quick" id="quickDuration"><button type="button" data-value="12" data-unit="months">12 شهر</button><button type="button" data-value="18" data-unit="months">18 شهر</button><button type="button" data-value="24" data-unit="months">24 شهر</button><button type="button" data-value="3" data-unit="years" class="active">3 سنوات</button></div></div>
          <div class="field"><label for="target">نسبة الربح السنوية المستهدفة</label><div class="input-wrap"><input id="target" type="number" min="0" max="500" step="0.1" value="18" inputmode="decimal"><span class="suffix">%</span></div></div>
          <div class="rate-tools"><button class="apply-rate" type="button" id="applyRate">تطبيق النسبة على السعر والدفعات</button><button class="undo-rate" type="button" id="undoRate" disabled>تراجع</button><small class="auto-note" id="autoNote">تحافظ الحاسبة على نسب الدفعات الحالية، وتصحح فرق التقريب في الدفعة الأخيرة.</small></div>
          <div class="field full"><label>طريقة السداد</label><div class="mode" id="mode"><button type="button" data-mode="bullet">دفعة في النهاية</button><button type="button" data-mode="equal">دفعات متساوية</button><button type="button" data-mode="custom" class="active">دفعات غير متساوية</button></div></div>
          <div class="field" id="countField" hidden><label for="count">عدد الدفعات</label><div class="input-wrap"><input id="count" type="number" min="1" max="120" step="1" value="3" inputmode="numeric"><span class="suffix">دفعة</span></div></div>
        </div>
        <div class="schedule" id="schedule"><div class="schedule-top"><b>جدول الدفعات</b><span class="sum" id="scheduleSum"></span></div><div class="pay-list" id="payList"></div><button class="add" id="addPayment" type="button">+ إضافة دفعة</button></div>
        <div class="actions"><button class="calculate" type="submit">احسب النتيجة</button><button class="reset" type="button" id="reset">إعادة</button></div>
      </form>
    </section>
    <section class="panel results" aria-live="polite" id="results"></section>
  </div>
  <div class="footnote">حساب مالي استرشادي يعتمد على البيانات المدخلة.</div>
</main>
<script>
const $=s=>document.querySelector(s), fmt=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(Math.round(n||0)), pct=n=>Number.isFinite(n)?new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n):'—', esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), SAR='<svg class="sar-icon" aria-hidden="true"><use href="#sar-mark"></use></svg>', val=el=>Number(String(el.value).replace(/,/g,''))||0, money=n=>'<span class="money-value">'+SAR+'<bdi>'+fmt(n)+'</bdi></span>',percentage=n=>'<bdi dir="ltr">'+pct(n)+'%</bdi>';
let mode='custom',undoState=null;
const product=$('#product'),cash=$('#cash'),deferred=$('#deferred'),duration=$('#duration'),durationUnit=$('#durationUnit'),target=$('#target'),count=$('#count'),payList=$('#payList'),schedule=$('#schedule'),countField=$('#countField'),addPayment=$('#addPayment'),results=$('#results'),applyRate=$('#applyRate'),undoRate=$('#undoRate'),autoNote=$('#autoNote');
function formatMoneyInput(el){const raw=String(el.value).replace(/[^0-9]/g,'');el.value=raw?Number(raw).toLocaleString('en-US'):''}
function unitWord(n){return durationUnit.value==='years'?(n===1?'سنة':'سنوات'):(n===1?'شهر':'أشهر')}
function paymentRow(term,amount){const row=document.createElement('div');row.className='pay-row';row.innerHTML='<span class="n"></span><input class="term" type="number" min="0.1" step="0.5" value="'+term+'" aria-label="موعد الاستحقاق"><div class="pay-amount"><input class="amount" type="text" value="'+fmt(amount)+'" inputmode="numeric" aria-label="مبلغ الدفعة">'+SAR+'</div><button class="remove" type="button" aria-label="حذف الدفعة">×</button>';row.querySelector('.remove').onclick=()=>{row.remove();renumber();calculate()};row.querySelector('.term').addEventListener('input',()=>{updateSum();calculate()});row.querySelector('.amount').addEventListener('input',e=>{formatMoneyInput(e.target);updateSum();calculate()});return row}
function renumber(){[...payList.children].forEach((r,i)=>r.querySelector('.n').textContent=i+1);updateSum()}
function buildSchedule(){const total=val(deferred),principal=val(cash),term=Math.max(.1,+duration.value||1);payList.innerHTML='';if(mode==='bullet'){payList.append(paymentRow(term,total))}else if(mode==='equal'){const n=Math.max(1,Math.min(120,+count.value||1));for(let i=1;i<=n;i++){const due=+(term*i/n).toFixed(2);const amount=i===n?total-(Math.round(total/n)*(n-1)):Math.round(total/n);payList.append(paymentRow(due,amount))}}else{const profit=Math.max(0,total-principal),presets=[[(term/3).toFixed(2),Math.round(profit/2)],[(term*2/3).toFixed(2),Math.round(profit/2)],[term,Math.max(0,total-Math.round(profit/2)*2)]],sane=total>=principal?presets:[[(term/3).toFixed(2),Math.round(total*.15)],[(term*2/3).toFixed(2),Math.round(total*.15)],[term,Math.round(total*.70)]];sane.forEach(p=>payList.append(paymentRow(p[0],p[1])))}renumber()}
function updateSum(){const total=[...payList.querySelectorAll('.amount')].reduce((s,i)=>s+val(i),0),due=val(deferred),el=$('#scheduleSum');el.innerHTML='الإجمالي '+money(total)+' من '+money(due);el.classList.toggle('bad',Math.abs(total-due)>.5)}
function payments(){const factor=durationUnit.value==='years'?12:1;return [...payList.children].map(r=>{const term=Math.max(.1,+r.querySelector('.term').value||1);return{month:term*factor,term,amount:Math.max(0,val(r.querySelector('.amount')))}}).filter(p=>p.amount>0).sort((a,b)=>a.month-b.month)}
function rawPayments(){return[...payList.children].map(r=>({term:+r.querySelector('.term').value||1,amount:Math.max(0,val(r.querySelector('.amount')))}))}
function setPayments(list){payList.innerHTML='';list.forEach(p=>payList.append(paymentRow(p.term,p.amount)));renumber()}
function captureState(){return{deferred:val(deferred),payments:rawPayments()}}
function scalePayments(newTotal){const rows=rawPayments(),oldTotal=rows.reduce((s,p)=>s+p.amount,0);if(!rows.length||oldTotal<=0){deferred.value=fmt(newTotal);buildSchedule();return}let used=0;const scaled=rows.map((p,i)=>{const amount=i===rows.length-1?newTotal-used:Math.round(p.amount/oldTotal*newTotal);used+=amount;return{term:p.term,amount}});deferred.value=fmt(newTotal);setPayments(scaled)}
function correctSchedule(){const due=val(deferred),rows=rawPayments(),sum=rows.reduce((s,p)=>s+p.amount,0);if(!rows.length||Math.abs(sum-due)<1)return false;const corrected=[...rows],last=corrected.length-1,difference=due-sum;if(corrected[last].amount+difference>=0){corrected[last].amount+=difference;setPayments(corrected)}else{scalePayments(due)}autoNote.textContent='تم تصحيح مجموع الدفعات ليتطابق مع سعر البيع الآجل.';autoNote.classList.add('done');return true}
function npv(rate,principal,pays){return -principal+pays.reduce((s,p)=>s+p.amount/Math.pow(1+rate,p.month),0)}
function monthlyIrr(principal,pays){if(principal<=0||!pays.length)return NaN;let lo=-.999999,hi=1;while(npv(hi,principal,pays)>0&&hi<1000)hi*=2;if(npv(lo,principal,pays)*npv(hi,principal,pays)>0)return NaN;for(let i=0;i<180;i++){const mid=(lo+hi)/2;if(npv(mid,principal,pays)>0)lo=mid;else hi=mid}return(lo+hi)/2}
function requiredTotal(principal,pays,targetAnnual){const sum=pays.reduce((s,p)=>s+p.amount,0);if(principal<=0||sum<=0)return NaN;const monthly=Math.pow(1+targetAnnual/100,1/12)-1;const pvUnit=pays.reduce((s,p)=>s+(p.amount/sum)/Math.pow(1+monthly,p.month),0);return principal/pvUnit}
function calculate(){const principal=val(cash),total=val(deferred),term=Math.max(.1,+duration.value||1),durationMonths=term*(durationUnit.value==='years'?12:1),goal=+target.value||0,pays=payments(),paid=pays.reduce((s,p)=>s+p.amount,0),profit=total-principal,totalPct=principal?profit/principal*100:NaN,simple=principal?totalPct/(durationMonths/12):NaN,monthly=monthlyIrr(principal,pays),annual=Number.isFinite(monthly)?(Math.pow(1+monthly,12)-1)*100:NaN,delta=simple-goal,valid=principal>0&&total>0&&pays.length&&Math.abs(paid-total)<1,productName=esc(product.value.trim()),targetProfit=principal*(goal/100)*(durationMonths/12),targetPrice=Math.ceil((principal+targetProfit)/1000)*1000,suggested=valid?Math.max(total,targetPrice):NaN,suggestedProfit=suggested-principal,suggestionNote=valid?(total>=targetPrice?'السعر الحالي يحقق النسبة المستهدفة':'الزيادة المطلوبة '+money(suggested-total)):'—';
const status=!valid?'أكمل جدول الدفعات ليطابق سعر البيع':delta>=0?'أعلى من المستهدف بـ '+percentage(delta):'أقل من المستهدف بـ '+percentage(Math.abs(delta));
results.innerHTML='<div class="result-hero"><span class="result-product">'+(productName?'نتيجة: '+productName:'نتيجة العملية')+'</span><div class="deal-summary">من '+money(principal)+' إلى '+money(total)+' خلال '+term+' '+unitWord(term)+'</div><span class="result-label">نسبة الربح السنوية البسيطة</span><div class="yield-line"><div class="yield">'+(valid?pct(simple):'—')+'<small>%</small></div><div class="target-state '+(valid?(delta>=0?'good':'low'):'')+'">'+status+'</div></div></div><div class="metrics"><div class="metric"><span>ربح البيع الكامل</span><strong>'+money(profit)+'</strong></div><div class="metric"><span>نسبة الربح على كامل المدة</span><strong>'+percentage(totalPct)+'</strong></div><div class="metric"><span>العائد السنوي الفعلي حسب الدفعات</span><strong>'+percentage(annual)+'</strong></div><div class="metric"><span>مدة السداد</span><strong>'+term+' '+unitWord(term)+'</strong></div></div><div class="needed"><span>سعر البيع الآجل حسب نسبة ربح سنوية '+percentage(goal)+'</span><strong>'+(valid?money(suggested):'—')+'</strong><small>'+(valid?'قيمة المنتج '+money(principal)+' + ربح البيع '+money(suggestedProfit)+' · '+suggestionNote:'—')+'</small></div><div class="result-schedule"><h3>ملخص السداد</h3><table class="result-table"><thead><tr><th>الدفعة</th><th>موعدها</th><th>المبلغ</th></tr></thead><tbody>'+pays.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>بعد '+p.term+' '+unitWord(p.term)+'</td><td>'+money(p.amount)+'</td></tr>').join('')+'</tbody></table></div>'+(valid?'':'<div class="notice" style="display:block">مجموع الدفعات يجب أن يساوي سعر البيع الآجل.</div>')}
$('#mode').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.mode;document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('active',x===b));countField.hidden=mode!=='equal';schedule.hidden=mode==='bullet';addPayment.hidden=mode!=='custom';buildSchedule();calculate()});
$('#quickDuration').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;duration.value=b.dataset.value;durationUnit.value=b.dataset.unit;document.querySelectorAll('#quickDuration button').forEach(x=>x.classList.toggle('active',x===b));buildSchedule();calculate()});
addPayment.onclick=()=>{payList.append(paymentRow(+duration.value||1,0));renumber()};
[product,target].forEach(i=>i.addEventListener('input',calculate));[cash,deferred].forEach(i=>i.addEventListener('input',e=>{formatMoneyInput(e.target);calculate()}));deferred.addEventListener('change',()=>{correctSchedule();calculate()});[duration,count].forEach(i=>i.addEventListener('input',()=>{buildSchedule();calculate()}));durationUnit.addEventListener('change',()=>{document.querySelectorAll('#quickDuration button').forEach(x=>x.classList.remove('active'));buildSchedule();calculate()});
applyRate.onclick=()=>{const principal=val(cash),goal=+target.value||0,term=Math.max(.1,+duration.value||1),years=term*(durationUnit.value==='years'?1:1/12);if(principal<=0||goal<0)return;undoState=captureState();undoRate.disabled=false;const newTotal=Math.ceil((principal+principal*(goal/100)*years)/1000)*1000;scalePayments(newTotal);autoNote.innerHTML='تم تطبيق '+percentage(goal)+' وتعديل السعر والدفعات بنفس توزيعها السابق.';autoNote.classList.add('done');calculate()};
undoRate.onclick=()=>{if(!undoState)return;deferred.value=fmt(undoState.deferred);setPayments(undoState.payments);undoState=null;undoRate.disabled=true;autoNote.textContent='تمت استعادة السعر والدفعات السابقة.';autoNote.classList.add('done');calculate()};
$('#calculator').addEventListener('submit',e=>{e.preventDefault();correctSchedule();calculate()});
$('#reset').onclick=()=>{product.value='';cash.value='150,000';deferred.value='200,000';duration.value=3;durationUnit.value='years';target.value=18;count.value=3;mode='custom';undoState=null;undoRate.disabled=true;autoNote.textContent='تحافظ الحاسبة على نسب الدفعات الحالية، وتصحح فرق التقريب في الدفعة الأخيرة.';autoNote.classList.remove('done');document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));countField.hidden=true;schedule.hidden=false;addPayment.hidden=false;document.querySelectorAll('#quickDuration button').forEach(x=>x.classList.toggle('active',x.dataset.value==='3'&&x.dataset.unit==='years'));buildSchedule();calculate()};
buildSchedule();calculate();
</script>
</body>
</html>
