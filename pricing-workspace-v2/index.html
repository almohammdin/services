<style>
:root{
  --ink:#101828;--muted:#667085;--line:#e4e7ec;--soft:#f7f8fb;--paper:#fff;
  --navy:#101828;--navy2:#263248;--gold:#b59a55;--ok:#0b7a53;--warn:#9a6816;--bad:#b42318;
  --blue:#0b4b8f;--shadow:0 18px 55px rgba(16,24,40,.10);
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-in-out:cubic-bezier(.77,0,.175,1)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;line-height:1.65;background:
  radial-gradient(circle at 10% -5%,rgba(181,154,85,.17),transparent 30%),
  radial-gradient(circle at 95% 0,rgba(16,24,40,.10),transparent 34%),
  linear-gradient(135deg,#f5f7fb,#eef2f7)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.ltr{direction:ltr;unicode-bidi:isolate}
.shell{max-width:1440px;margin:auto;padding:16px;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.app-mark{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#101828,#29364e);display:grid;place-items:center;box-shadow:0 10px 28px rgba(16,24,40,.18);overflow:hidden}
.app-mark img{width:100%;height:100%;object-fit:cover}
.brand h1{margin:0;font-size:24px;line-height:1.25;color:var(--navy);font-weight:900}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(181,154,85,.45);background:#fffaf0;color:#5f4b18;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:900}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px}
.rail{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:24px;padding:12px;box-shadow:var(--shadow);position:sticky;top:14px;height:calc(100vh - 92px)}
.nav{display:grid;gap:6px}
.nav button{border:0;background:transparent;border-radius:15px;padding:12px 11px;text-align:right;color:#344054;font-weight:900;display:flex;align-items:center;gap:9px;transition:background 160ms var(--ease-out),transform 140ms var(--ease-out)}
.nav button:active,.btn:active,.chip:active{transform:scale(.98)}
.nav button.active{background:var(--navy);color:#fff;box-shadow:0 10px 25px rgba(16,24,40,.14)}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rail-note{margin-top:12px;border:1px solid var(--line);border-radius:18px;background:#f8fafc;padding:11px;color:#475467;font-size:11.5px;font-weight:700}
.main{min-width:0}
.view{display:none;animation:enter 180ms var(--ease-out)}
.view.active{display:block}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.page-head h2{margin:0;color:var(--navy);font-size:22px;line-height:1.25}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:13px;font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;min-height:40px;padding:8px 13px;font-weight:900;background:#edf1f7;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform 140ms var(--ease-out),box-shadow 180ms var(--ease-out),background 180ms var(--ease-out)}
.btn.primary{background:var(--navy);color:#fff;box-shadow:0 12px 28px rgba(16,24,40,.17)}
.btn.gold{background:var(--gold);color:#111827}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.btn.danger{background:#fff4f2;color:var(--bad);border:1px solid #f3c4bc}
.grid{display:grid;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 10px 28px rgba(16,24,40,.06)}
.kpi span{display:block;color:var(--muted);font-size:11.5px;font-weight:800}
.kpi b{display:block;margin-top:5px;color:var(--navy);font-size:24px;line-height:1;font-family:'IBM Plex Sans',Arial,sans-serif}
.kpi.ok b{color:var(--ok)}.kpi.warn b{color:var(--warn)}.kpi.bad b{color:var(--bad)}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.card-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-head h3{margin:0;color:var(--navy);font-size:15px}
.card-body{padding:14px 16px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{min-width:220px;flex:1}
input,select,textarea{width:100%;border:1px solid #cfd6e0;background:#fff;border-radius:13px;padding:9px 11px;color:var(--ink);outline:none;font-size:13px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(181,154,85,.13)}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900;color:#344054}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:820px}
th,td{border-bottom:1px solid #eef1f5;padding:10px;text-align:right;vertical-align:top}
th{color:#475467;background:#f8fafc;font-size:11px;font-weight:900;white-space:nowrap}
td strong{color:var(--navy)}
.status{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:900;white-space:nowrap}
.status.active{background:#ecfdf3;color:#166534}.status.draft{background:#f2f4f7;color:#344054}.status.sent{background:#eff6ff;color:#1d4ed8}.status.expired{background:#fef2f2;color:#991b1b}.status.won{background:#dcfce7;color:#14532d}.status.lost{background:#fee2e2;color:#991b1b}.status.follow{background:#fff7ed;color:#9a3412}
.twocol{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}
.client-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.client-card{border:1px solid var(--line);border-radius:20px;background:#fff;padding:13px;cursor:pointer;transition:border-color 160ms var(--ease-out),box-shadow 160ms var(--ease-out),transform 140ms var(--ease-out)}
.client-card:hover{border-color:var(--gold);box-shadow:0 12px 24px rgba(181,154,85,.12)}
.client-card h4{margin:0 0 4px;color:var(--navy);font-size:14px}
.client-card p{margin:0;color:var(--muted);font-size:12px}
.client-card .mini-line{margin-top:9px;display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:#475467}
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.step{border:1px solid var(--line);background:#fff;border-radius:15px;padding:9px;text-align:center;font-size:11.5px;font-weight:900;color:#475467}
.step.active{background:var(--navy);border-color:var(--navy);color:#fff}
.builder{display:grid;grid-template-columns:minmax(360px,480px) minmax(0,1fr);gap:12px;align-items:start}
.form-panel{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.form-stage{display:none;padding:15px}
.form-stage.active{display:block}
.form-stage h3{margin:0 0 12px;color:var(--navy);font-size:16px}
.field{margin-bottom:10px}
.field label{display:block;margin:0 0 5px;color:#344054;font-weight:900;font-size:11.5px}
.form-nav{display:flex;gap:8px;justify-content:space-between;border-top:1px solid var(--line);padding:12px 15px;background:#fbfcfe}
.brand-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.brand-option{border:1px solid var(--line);border-radius:16px;padding:10px;cursor:pointer;background:#fff}
.brand-option:has(input:checked){border-color:var(--gold);background:#fffaf0;box-shadow:0 0 0 3px rgba(181,154,85,.10)}
.brand-option input{width:auto}
.brand-option b{display:block;color:var(--navy);font-size:12.5px}
.brand-option span{display:block;color:var(--muted);font-size:11px}
.advanced{border:1px solid var(--line);border-radius:17px;overflow:hidden;margin-top:10px;background:#fff}
.advanced summary{cursor:pointer;padding:11px 12px;color:var(--navy);font-weight:900;list-style:none}
.advanced summary::-webkit-details-marker{display:none}
.advanced .inside{padding:0 12px 12px;color:#475467;font-size:12px}
.quote-preview{background:#dde3ec;border-radius:24px;padding:14px;position:sticky;top:14px;box-shadow:var(--shadow);min-height:760px}
.paper{width:210mm;height:297mm;max-width:100%;aspect-ratio:210/297;background:#fff;border:1px solid #d8dee8;box-shadow:0 12px 35px rgba(16,24,40,.14);margin:auto;position:relative;overflow:hidden;padding:9mm 10mm 20mm;transform-origin:top center}
.paper:before{content:'';position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(181,154,85,.95),rgba(181,154,85,.30)) 0 0/100% 2.2mm no-repeat,
  linear-gradient(90deg,transparent,rgba(181,154,85,.80),transparent) 8mm calc(100% - 6mm)/calc(100% - 16mm) 1px no-repeat,
  radial-gradient(circle at 88% 10%,rgba(181,154,85,.07),transparent 20%);pointer-events:none}
.paper>*{position:relative;z-index:1}
.paper-logo{height:25mm;display:flex;align-items:center;justify-content:center}
.paper-logo img{max-height:23mm;max-width:92mm;object-fit:contain;filter:brightness(0) contrast(1.2)}
.paper-logo .hatta{filter:none;max-width:116mm;max-height:30mm}
.paper-head{display:grid;grid-template-columns:1.25fr .75fr;gap:7mm;border-top:2px solid var(--navy);border-bottom:2px solid var(--navy);padding:4mm 0}
.paper h2{margin:0;color:var(--navy);font-size:19px}
.paper .sub{margin-top:1mm;color:#344054;font-size:10.5px;font-weight:800}
.meta{display:grid;gap:1.3mm}
.meta div{display:flex;justify-content:space-between;border-bottom:1px solid #d8dee8;font-size:10px;padding-bottom:1mm}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:3mm;margin-top:4mm}
.qbox{border:1px solid #d8dee8;background:#f8fafc;border-radius:13px;padding:3mm}
.qbox small{display:block;color:var(--gold);font-weight:900;font-size:9.5px}
.qbox b{display:block;color:var(--navy);font-size:12.8px;margin-top:.5mm}
.section{margin-top:4mm}
.section h3{margin:0 0 1.6mm;color:var(--navy);font-size:11.5px}
.scope,.payment{border:1px solid #d8dee8;background:#fff;border-radius:12px;padding:2.6mm;font-size:10.3px;color:#1d2939}
.deliverables{display:grid;grid-template-columns:1fr 1fr;gap:1.5mm 5mm;margin:0;padding:0 5mm 0 0;font-size:10px}
.deliverables li::marker{color:var(--gold)}
.money{display:grid;grid-template-columns:.9fr 1.1fr;gap:3mm}
.price{background:linear-gradient(135deg,var(--navy),#29364e);color:#fff;border-radius:15px;padding:4mm}
.price small{font-size:9.5px;color:rgba(255,255,255,.72)}
.price b{display:block;font-size:24px;font-family:'IBM Plex Sans',Arial,sans-serif;direction:ltr}
.words{font-size:9px;color:rgba(255,255,255,.80)}
.approval{border:1px solid #d8dee8;border-radius:13px;padding:3mm;margin-top:4mm}
.sign{display:grid;grid-template-columns:repeat(4,1fr);gap:2mm}
.sign div{min-height:13mm;border-bottom:1px dashed #667085;color:#344054;font-size:9.2px}
.paper-footer{position:absolute;left:10mm;right:10mm;bottom:7mm;border-top:1px solid #d8dee8;padding-top:2mm;display:flex;justify-content:space-between;align-items:center;font-size:8.3px;color:#344054}
.social{display:inline-flex;align-items:center;gap:6px;direction:ltr;border:1px solid rgba(181,154,85,.35);background:#fffaf0;border-radius:999px;padding:2.5px 7px;font-weight:900;color:var(--navy)}
.social-icons{display:inline-flex;gap:3px;color:var(--gold)}
.social-icons svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.drawer{position:fixed;inset:0;z-index:50;display:none}
.drawer.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(16,24,40,.32)}
.drawer-panel{position:absolute;top:0;bottom:0;left:0;width:min(460px,100%);background:#fff;box-shadow:-18px 0 50px rgba(16,24,40,.18);padding:18px;transform:translateX(-100%);animation:slideIn 220ms var(--ease-out) forwards;overflow:auto}
@keyframes slideIn{to{transform:translateX(0)}}
.drawer-panel h3{margin:0;color:var(--navy)}
.drawer-row{border:1px solid var(--line);background:#f8fafc;border-radius:16px;padding:11px;margin-top:10px}
.drawer-row span{display:block;color:var(--muted);font-size:11px;font-weight:800}
.drawer-row b{display:block;color:var(--navy)}
.toast{position:fixed;left:18px;bottom:18px;background:#101828;color:#fff;border:1px solid rgba(181,154,85,.45);box-shadow:0 16px 40px rgba(16,24,40,.22);border-radius:16px;padding:12px 14px;font-size:13px;font-weight:900;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity 180ms var(--ease-out),transform 180ms var(--ease-out);z-index:70}
.toast.show{opacity:1;transform:none}
@media(max-width:1120px){.layout{grid-template-columns:1fr}.rail{position:relative;height:auto}.nav{grid-template-columns:repeat(5,1fr)}.nav button{justify-content:center;text-align:center}.builder{grid-template-columns:1fr}.quote-preview{position:relative}.paper{transform:scale(.74);margin-bottom:-74mm}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.shell{padding:10px}.topbar{align-items:flex-start}.layout{gap:10px}.nav{grid-template-columns:repeat(2,1fr)}.page-head,.topbar{flex-direction:column}.brand-options,.grid2,.grid3,.boxes,.money{grid-template-columns:1fr}.paper{transform:scale(.44);margin-bottom:-166mm}.quote-preview{padding:8px}.kpis{grid-template-columns:1fr}}
@media print{body{background:#fff}.topbar,.rail,.page-head,.form-panel,.toolbar,.drawer,.toast{display:none!important}.shell{padding:0}.layout,.builder{display:block}.quote-preview{background:#fff;padding:0;box-shadow:none}.paper{transform:none!important;box-shadow:none;border:0;margin:0;width:210mm;height:297mm;max-width:none}@page{size:A4;margin:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

}
function closeDrawer(){$('drawer').classList.remove('open')}
function editOffer(id){const o=state.offers.find(x=>x.id===id);if(!o)return;state.quote={...state.quote,brand:o.brand,clientId:o.clientId,service:o.service,amount:o.amount,validDays:o.validDays,duration:'10 أيام عمل',step:0};closeDrawer();go('builder')}
function duplicateOffer(id){const o=state.offers.find(x=>x.id===id);if(!o)return;state.offers.unshift({...o,id:'q'+Date.now(),no:o.no+'-COPY',status:'draft'});persist();renderOffers();showToast('تم نسخ العرض')}
function renderSettings(){
  $('settings').innerHTML=`<div class="page-head"><div><h2>الإعدادات</h2><p>ملفات الهوية والسداد والخدمات تكون هنا، وليس داخل كل عرض.</p></div></div>
  <div class="twocol"><div class="card"><div class="card-head"><h3>ملفات الهوية</h3></div><div class="card-body">
    ${['نايف المحمدي','شركة حتى لحلول الأعمال','هجين: حتى + نايف','هوية مخصصة'].map(x=>`<div class="drawer-row"><span>ملف هوية</span><b>${x}</b></div>`).join('')}
  </div></div><div class="card"><div class="card-head"><h3>ملفات السداد</h3></div><div class="card-body">
    <div class="drawer-row"><span>ملف سداد</span><b>حساب نايف المحمدي</b></div>
    <div class="drawer-row"><span>ملف سداد</span><b>حساب شركة حتى</b></div>
    <div class="drawer-row"><span>ملف سداد</span><b>حساب مخصص</b></div>
  </div></div></div>`;
}
renderNav();go('dashboard');
</script>
