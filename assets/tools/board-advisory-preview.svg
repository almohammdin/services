<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">مجلس الإدارة والمجلس الاستشاري والمرشد</title>
  <desc id="desc">صورة تعريفية لأداة مقارنة مسارات الدعم القيادي</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1428"/>
      <stop offset=".58" stop-color="#081220"/>
      <stop offset="1" stop-color="#050a12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a24d"/>
      <stop offset="1" stop-color="#ead18d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <circle cx="120" cy="80" r="250" fill="#bd282e" opacity=".18"/>
  <circle cx="1100" cy="545" r="290" fill="#46526b" opacity=".18"/>
  <g opacity=".06" stroke="#fff">
    <path d="M0 90h1200M0 180h1200M0 270h1200M0 360h1200M0 450h1200M0 540h1200"/>
    <path d="M90 0v630M180 0v630M270 0v630M360 0v630M450 0v630M540 0v630M630 0v630M720 0v630M810 0v630M900 0v630M990 0v630M1080 0v630"/>
  </g>
  <g font-family="Arial, Tahoma, sans-serif" text-anchor="middle">
    <text x="600" y="102" fill="url(#gold)" font-size="25" font-weight="700">دليل عملي لاختيار المسار الأنسب</text>
    <text x="600" y="166" fill="#fff" font-size="42" font-weight="700">مجلس الإدارة أم المجلس الاستشاري أم المرشد؟</text>
    <text x="600" y="210" fill="#fff" opacity=".7" font-size="22">مقارنة الصلاحيات والمسؤوليات والقيمة المتوقعة</text>
  </g>
  <g filter="url(#shadow)" font-family="Arial, Tahoma, sans-serif" text-anchor="middle">
    <g transform="translate(80 282)">
      <rect width="320" height="220" rx="24" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/>
      <circle cx="160" cy="58" r="28" fill="#c9a24d" fill-opacity=".18" stroke="#c9a24d" stroke-opacity=".65"/>
      <path d="M145 58h30M160 43v30" stroke="#e7c977" stroke-width="4" stroke-linecap="round"/>
      <text x="160" y="116" fill="#fff" font-size="27" font-weight="700">مجلس الإدارة</text>
      <text x="160" y="158" fill="#fff" opacity=".68" font-size="18">صلاحيات ومسؤولية</text>
      <text x="160" y="190" fill="#fff" opacity=".68" font-size="18">وقرارات ملزمة</text>
    </g>
    <g transform="translate(440 282)">
      <rect width="320" height="220" rx="24" fill="#fff" fill-opacity=".09" stroke="#c9a24d" stroke-opacity=".55"/>
      <circle cx="160" cy="58" r="28" fill="#c9a24d" fill-opacity=".18" stroke="#c9a24d" stroke-opacity=".65"/>
      <path d="M145 52h30M145 61h30M151 70h18" stroke="#e7c977" stroke-width="4" stroke-linecap="round"/>
      <text x="160" y="116" fill="#fff" font-size="27" font-weight="700">المجلس الاستشاري</text>
      <text x="160" y="158" fill="#fff" opacity=".68" font-size="18">خبرات متنوعة</text>
      <text x="160" y="190" fill="#fff" opacity=".68" font-size="18">وتوصيات داعمة</text>
    </g>
    <g transform="translate(800 282)">
      <rect width="320" height="220" rx="24" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/>
      <circle cx="160" cy="58" r="28" fill="#c9a24d" fill-opacity=".18" stroke="#c9a24d" stroke-opacity=".65"/>
      <path d="M147 69c5-10 21-10 26 0M151 51a9 9 0 1 0 18 0 9 9 0 0 0-18 0Z" fill="none" stroke="#e7c977" stroke-width="4" stroke-linecap="round"/>
      <text x="160" y="116" fill="#fff" font-size="27" font-weight="700">المرشد</text>
      <text x="160" y="158" fill="#fff" opacity=".68" font-size="18">دعم فردي</text>
      <text x="160" y="190" fill="#fff" opacity=".68" font-size="18">وشريك تفكير</text>
    </g>
  </g>
  <rect x="432" y="552" width="336" height="4" rx="2" fill="url(#gold)"/>
</svg>
