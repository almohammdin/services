name: Recover GANACSI Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ganacsi-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install recovery tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libjpeg-turbo-progs imagemagick ffmpeg

      - name: Inspect and recover
        run: |
          set +e
          SRC='ganacsi/assets/ganacsi-share-v8.jpg'
          OUT='ganacsi/assets/ganacsi-share-wa-final.jpg'
          REPORT='ganacsi/assets/ganacsi-recovery-report.txt'
          : > "$REPORT"

          echo '=== file ===' | tee -a "$REPORT"
          file "$SRC" 2>&1 | tee -a "$REPORT"
          echo '=== bytes ===' | tee -a "$REPORT"
          wc -c "$SRC" | tee -a "$REPORT"
          echo '=== first 128 bytes ===' | tee -a "$REPORT"
          xxd -l 128 "$SRC" | tee -a "$REPORT"
          echo '=== jpeginfo ===' | tee -a "$REPORT"
          jpeginfo -c "$SRC" 2>&1 | tee -a "$REPORT"
          echo '=== identify ===' | tee -a "$REPORT"
          identify -verbose "$SRC" 2>&1 | head -80 | tee -a "$REPORT"
          echo '=== ffprobe ===' | tee -a "$REPORT"
          ffprobe -v error -show_entries stream=codec_name,width,height,pix_fmt -of default=nw=1 "$SRC" 2>&1 | tee -a "$REPORT"

          rm -f /tmp/recovered*.jpg /tmp/recovered.ppm "$OUT"

          echo '=== try djpeg ===' | tee -a "$REPORT"
          djpeg -recover -outfile /tmp/recovered.ppm "$SRC" 2>&1 | tee -a "$REPORT"
          if [ -s /tmp/recovered.ppm ]; then
            cjpeg -quality 55 -optimize -outfile /tmp/recovered-djpeg.jpg /tmp/recovered.ppm 2>&1 | tee -a "$REPORT"
          fi

          echo '=== try ImageMagick ===' | tee -a "$REPORT"
          convert "$SRC" -background white -alpha remove -alpha off -resize '1200x630>' -gravity center -extent 1200x630 -quality 55 /tmp/recovered-im.jpg 2>&1 | tee -a "$REPORT"

          echo '=== try ffmpeg ===' | tee -a "$REPORT"
          ffmpeg -y -v warning -err_detect ignore_err -i "$SRC" -vf "scale=1200:630:force_original_aspect_ratio=decrease,pad=1200:630:(ow-iw)/2:(oh-ih)/2:white" -frames:v 1 -q:v 8 /tmp/recovered-ff.jpg 2>&1 | tee -a "$REPORT"

          set -e
          python - <<'PY'
          from PIL import Image, ImageFile
          from pathlib import Path
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          candidates = [Path('/tmp/recovered-djpeg.jpg'), Path('/tmp/recovered-im.jpg'), Path('/tmp/recovered-ff.jpg')]
          out = Path('ganacsi/assets/ganacsi-share-wa-final.jpg')
          report = Path('ganacsi/assets/ganacsi-recovery-report.txt')
          valid=[]
          for p in candidates:
              if not p.exists() or p.stat().st_size == 0:
                  continue
              try:
                  im=Image.open(p); im.load()
                  valid.append((p, im.size, im.mode, p.stat().st_size))
              except Exception as e:
                  with report.open('a') as f: f.write(f'candidate broken {p}: {e}\n')
          with report.open('a') as f: f.write('valid_candidates='+repr(valid)+'\n')
          if not valid:
              raise SystemExit('No decoder could recover source')
          p=valid[0][0]
          im=Image.open(p).convert('RGB')
          if im.size != (1200,630):
              canvas=Image.new('RGB',(1200,630),'white')
              im.thumbnail((1200,630),Image.Resampling.LANCZOS)
              canvas.paste(im,((1200-im.width)//2,(630-im.height)//2))
              im=canvas
          im.save(out,'JPEG',quality=55,optimize=True,progressive=False,subsampling=2)
          check=Image.open(out); check.load()
          assert check.format=='JPEG' and check.mode=='RGB' and check.size==(1200,630)
          with report.open('a') as f:
              f.write(f'FINAL format={check.format} mode={check.mode} size={check.size} bytes={out.stat().st_size} magic={out.read_bytes()[:3].hex()}\n')
          print(report.read_text())
          PY

      - name: Commit recovered preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ganacsi/assets/ganacsi-share-wa-final.jpg ganacsi/assets/ganacsi-recovery-report.txt
          git commit -m 'Recover valid GANACSI preview JPEG' || exit 0
          git push
