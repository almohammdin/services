name: Audit GANACSI Preview Assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ganacsi-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Audit all GANACSI images
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib

          root = Path('ganacsi/assets')
          report = root / 'ganacsi-image-audit.txt'
          rows = []

          for p in sorted(root.iterdir()):
              if p.suffix.lower() not in {'.jpg', '.jpeg', '.png', '.webp'}:
                  continue
              raw = p.read_bytes()
              magic = raw[:16].hex()
              sha256 = hashlib.sha256(raw).hexdigest()[:16]
              try:
                  im = Image.open(p)
                  im.load()
                  rows.append(
                      f'VALID | {p.name} | format={im.format} | mode={im.mode} | size={im.width}x{im.height} | bytes={len(raw)} | progressive={bool(im.info.get("progressive"))} | magic={magic} | sha256={sha256}'
                  )
              except Exception as exc:
                  rows.append(
                      f'BROKEN | {p.name} | bytes={len(raw)} | magic={magic} | sha256={sha256} | error={type(exc).__name__}: {exc}'
                  )

          report.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          print(report.read_text())
          PY

      - name: Commit audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ganacsi/assets/ganacsi-image-audit.txt
          if git diff --cached --quiet; then
            echo 'Audit already up to date.'
            exit 0
          fi
          git commit -m 'Audit GANACSI preview image files'
          git push
