name: Exhibitions live verification
on:
  push:
    branches: [main]
    paths: ['exhibitions/index.html', 'exhibitions/assets/**', '.github/workflows/exhibitions-live-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exhibitions-live-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated browser
        run: |
          npm install --prefix /tmp/exhibitions-live playwright@1.56.1 --no-audit --no-fund
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            node /tmp/exhibitions-live/node_modules/playwright/cli.js install --with-deps chromium
          fi
      - name: Verify published assets and browser flow
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          cat > /tmp/exhibitions-live/verify.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const origin='https://almohammdin.github.io';
          const url=origin+'/services/exhibitions/';
          const local=fs.readFileSync('exhibitions/index.html','utf8');
          const script=local.match(/src="([^"]+\/assets\/index-[^"]+\.js)"/)[1];
          const css=local.match(/href="([^"]+\/assets\/index-[^"]+\.css)"/)[1];
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          fs.mkdirSync('live-qa',{recursive:true});
          let browser;
          (async()=>{
            let ready=false;
            for(let attempt=0;attempt<36;attempt++){
              try{
                const r=await fetch(url+'?release='+process.env.RELEASE_SHA,{headers:{'Cache-Control':'no-cache'}});
                const html=await r.text();
                if(r.ok&&html.includes(script)&&html.includes(css)){
                  const paths=[script,css];
                  for(const asset of paths){
                    const response=await fetch(origin+asset);
                    assert.ok(response.ok);
                    const bytes=Buffer.from(await response.arrayBuffer());
                    const localPath=asset.replace('/services/','');
                    assert.equal(hash(bytes),hash(fs.readFileSync(localPath)));
                  }
                  ready=true;break;
                }
              }catch(e){console.log('Waiting for matching deployment: '+e.message);}
              await wait(10000);
            }
            assert.ok(ready,'Published HTML/assets did not match this release');
            browser=await chromium.launch({headless:true,...(process.env.CHROME_PATH?{executablePath:process.env.CHROME_PATH}:{})});
            const context=await browser.newContext({viewport:{width:1440,height:1000},locale:'ar-SA'});
            const page=await context.newPage(),errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto(url+'?release='+process.env.RELEASE_SHA);
            await page.locator('.welcome').waitFor();await page.evaluate(()=>document.fonts.ready);
            assert.equal(await page.locator('.role-choice').count(),2);
            assert.equal(await page.getByText('صاحبة المنصة',{exact:true}).count(),0);
            assert.equal((await page.locator('.footer-prepared').innerText()).trim(),'أعدت بواسطة');
            await page.screenshot({path:'live-qa/home-desktop.png',fullPage:true});
            await page.getByRole('button',{name:'زائر أزور المعرض أو أحضر المؤتمر'}).click();
            await page.getByLabel('اسم الفعالية',{exact:true}).fill('اختبار النسخة المنشورة');
            await page.getByRole('radio',{name:/البحث عن موردين/}).check();
            await page.getByRole('button',{name:'عرض خطتي',exact:true}).click();
            await page.getByRole('heading',{name:'خطة مشاركتك',exact:true}).waitFor();
            assert.equal(await page.locator('.starter-task').count(),3);
            await page.screenshot({path:'live-qa/plan-desktop.png',fullPage:true});
            const mobile=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,locale:'ar-SA'});
            const mp=await mobile.newPage();await mp.goto(url);await mp.locator('.welcome').waitFor();await mp.evaluate(()=>document.fonts.ready);
            assert.ok(await mp.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));
            await mp.screenshot({path:'live-qa/home-mobile.png',fullPage:true});
            assert.deepEqual(errors,[]);
            const result={passed:true,url,release:process.env.RELEASE_SHA,script,css,checks:['Published HTML points to current build','Published JS/CSS byte hashes match repository','Live desktop onboarding creates plan','Live mobile layout has no horizontal overflow','Footer attribution verified'],runtimeErrors:errors};
            fs.writeFileSync('live-qa/result.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result));
          })().catch(e=>{console.error(e);fs.writeFileSync('live-qa/result.json',JSON.stringify({passed:false,error:String(e)},null,2));process.exitCode=1;}).finally(async()=>{if(browser)await browser.close();});
          JS
          node /tmp/exhibitions-live/verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exhibitions-live-qa
          path: live-qa/
          retention-days: 3
          if-no-files-found: ignore
