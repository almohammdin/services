name: Knowledge Bank V1 verification
on:
  push:
    branches: [feature/knowledge-bank-v1-20261004]
    paths: [.github/kb-bootstrap/part3.txt]
permissions:
  contents: write
concurrency:
  group: knowledge-bank-v1-bootstrap
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/knowledge-bank-v1-20261004
      - name: Materialize reviewed source files
        run: |
          python3 - <<'PY'
          import pathlib, base64, bz2, json, hashlib
          prefix=pathlib.Path('knowledge-bank')
          if prefix.exists():
              raise SystemExit('Target directory already exists; refusing to overwrite it.')
          encoded=''.join(pathlib.Path(f'.github/kb-bootstrap/part{i}.txt').read_text().strip() for i in range(1,4))
          raw=bz2.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='a9458135ac283d0c706282927a15f725b1df39b217a962de77679b0a7818f48f'
          files=json.loads(raw)
          for name,content in files.items():
              path=pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              target=prefix / name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(content,encoding='utf-8')
          (prefix/'.gitignore').write_text('test-artifacts/\nnode_modules/\n__pycache__/\n')
          print(f'Materialized {len(files)} reviewed files; no other applications modified.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Domain and encryption tests
        working-directory: knowledge-bank
        run: npm test && npm run check
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Test browser flows and responsive layouts
        run: python3 knowledge-bank/tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-bank-browser-verification
          path: knowledge-bank/test-artifacts/
          if-no-files-found: ignore
      - name: Commit only the verified new application
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- knowledge-bank
          git rm -- .github/kb-bootstrap/part1.txt .github/kb-bootstrap/part2.txt .github/kb-bootstrap/part3.txt .github/workflows/knowledge-bank-bootstrap.yml
          git commit -m 'Add verified knowledge bank V1: private vault, matching, introductions and tasks'
          git push origin HEAD:feature/knowledge-bank-v1-20261004
