name: Waqqe mobile v0.10.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/waqqe-mobile-v10.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add mobile stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('waqqe/index.html')
          s=p.read_text()
          if 'mobile-v10.css' not in s:
              s=s.replace('<link rel="stylesheet" href="rename-v9.css?v=0.9.0">','<link rel="stylesheet" href="rename-v9.css?v=0.9.0">\n<link rel="stylesheet" href="mobile-v10.css?v=0.10.0">')
          s=s.replace('v0.9.0</b>','v0.10.0</b>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "Waqqe Bot"
          git config user.email "actions@users.noreply.github.com"
          git add waqqe/index.html
          git diff --cached --quiet || git commit -m "Publish Waqqe mobile viewport and language scroll v0.10.0"
          git push
