name: Patch pricing recovery

on:
  push:
    paths:
      - .github/workflows/patch-pricing-naif-logo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pricing file
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pricing/index.html')
          html = p.read_text(encoding='utf-8')
          html = html.replace('.brand-logo.naif-logo{max-width:68mm;max-height:23mm}', '.brand-logo.naif-logo{max-width:68mm;max-height:23mm;filter:brightness(0) contrast(1.25);opacity:.98}')
          html = html.replace('.footer-naif{width:22mm;height:10mm;object-fit:contain;display:inline-block}', '.footer-naif{width:22mm;height:10mm;object-fit:contain;display:inline-block;filter:brightness(0) contrast(1.25);opacity:.98}')
          html = html.replace("import{getFirestore,doc,setDoc,getDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';", "import{getFirestore,collection,doc,setDoc,getDocs,getDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';")
          old = "async function loadCloud(){const snap=await getDoc(doc(db,'pricingTool',user.uid));cloud=snap.exists()?snap.data():{quotes:[]};if(cloud.current)fill(cloud.current);else setPreset('liquidation_pre');render()}"
          new = "async function loadCloud(){const snap=await getDoc(doc(db,'pricingTool',user.uid));cloud=snap.exists()?snap.data():{quotes:[]};cloud.quotes=Array.isArray(cloud.quotes)?cloud.quotes:[];const seen=new Set(cloud.quotes.map(x=>x.quoteNo||x.id||((x.client||'')+'|'+(x.service||''))));function addRecovered(r){const row={brandMode:r.brandMode||r.identity||'naif',client:r.client||r.clientName||r.company||r.name||'عميل محفوظ',quoteNo:r.quoteNo||r.quote||r.quote_number||r.id||('REC-'+Date.now()),service:r.service||'custom',amount:Number(r.amount||r.quoteAmount||r.quote_amount||r.value||0),validDays:Number(r.validDays||r.validCount||7),duration:r.duration||r.deliveryTime||'10 أيام عمل',scope:r.scope||r.scopeOut||r.notes||'',deliverables:Array.isArray(r.deliverables)?r.deliverables.join('\\n'):(r.deliverables||r.serviceName||''),extras:Array.isArray(r.extras)?r.extras:[],payment:r.payment||r.paymentTerms||'',terms:r.terms||'',outSummary:r.outSummary||r.summary||'',outPoints:r.outPoints||'',outRecs:r.outRecs||'',outNext:r.outNext||'',freeNotes:r.freeNotes||r.notes||'',owner:r.owner||'',followDate:r.followDate||'',status:r.status||'تم إرسال العرض',nextDate:r.nextDate||r.nextFollowupDate||'',savedAt:r.savedAt||r.createdAt||todayISO(),updatedAtIso:r.updatedAtIso||r.updatedAt||new Date().toISOString()};const k=row.quoteNo||((row.client||'')+'|'+(row.service||''));if(!seen.has(k)){cloud.quotes.push(row);seen.add(k)}}try{const legacy=await getDocs(collection(db,'pricingUsers',user.uid,'quotes'));legacy.docs.forEach(d=>addRecovered({id:d.id,...d.data()}))}catch(e){console.warn('legacy cloud recovery skipped',e)}try{['naif_service_pricing_crm_v1','services_pricing_unified_v7','hatta_service_pricing_crm_v1','hatta_business_solutions_crm_v5_clean'].forEach(k=>{const raw=localStorage.getItem(k);if(!raw)return;const parsed=JSON.parse(raw);(Array.isArray(parsed)?parsed:(parsed.quotes||[])).forEach(addRecovered)})}catch(e){console.warn('local recovery skipped',e)}if(!cloud.current&&cloud.quotes.length)cloud.current=cloud.quotes[0];if(cloud.quotes.length)await setDoc(doc(db,'pricingTool',user.uid),{...cloud,updatedAt:serverTimestamp()},{merge:true}).catch(()=>{});if(cloud.current)fill(cloud.current);else setPreset('liquidation_pre');render()}"
          if old in html:
              html = html.replace(old, new)
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pricing/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Recover pricing saved data and fix Naif logo contrast"
          git push
