<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MA France Trans · Aperçu commercial</title><link rel="stylesheet" href="https://almohammdin.github.io/hatta-brand-guide/downloads/brand.css"><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172b45;font:17px/1.8 'El Messiri',Arial,sans-serif}body:lang(ar){font-family:'Thmanyah Sans',Tahoma,sans-serif}header,main,footer{max-width:1100px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between}header img{width:240px;max-width:55vw;height:auto}.draft{background:#fff3d9;padding:8px 16px;text-align:center;font-size:13px}.hero{padding:65px 0}h1{font-size:clamp(34px,6vw,60px);line-height:1.2;margin:14px 0;max-width:850px}h1:lang(ar){font-family:'Thmanyah Serif Display',serif}.eyebrow{color:#b41d2e;font-size:13px;letter-spacing:2px}p{color:#617187;max-width:750px}section{background:white;border:1px solid #dde3ed;padding:30px;border-radius:18px;margin-bottom:25px}form{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:14px}input,textarea,select,button{font:inherit;font-size:16px;min-height:44px;border:1px solid #cbd5e1;border-radius:8px;padding:10px;width:100%}button{background:#173d90;color:white;cursor:pointer}textarea{min-height:100px}.wide{grid-column:1/-1}#request{white-space:pre-wrap;direction:ltr;border:1px solid #dce3eb;padding:20px;background:#f7f9fc}footer{font-size:13px;color:#6a7889}a{color:#173d90}*:focus-visible{outline:3px solid #b37a27;outline-offset:3px}@media(max-width:600px){form{grid-template-columns:1fr}.hero{padding:35px 0}main{padding:18px}section{padding:20px}}</style></head><body><div class="draft" id="draft"></div><header><img src="../logo.jpeg" alt="MA France Trans"><select id="language" style="width:140px" aria-label="Language"><option value="fr">Français</option><option value="es">Español</option><option value="ar">العربية</option></select></header><main id="main"></main><footer>MA France Trans · <span id="foot"></span></footer><script>
const texts={fr:{draft:'Aperçu à valider par Hassan · non indexé',title:'Préparons votre demande de transport vers le Maroc.',intro:'Présentez votre besoin : lieu de chargement, destination, dates et caractéristiques de la marchandise.',form:'Préparer une demande de devis',note:'Ce formulaire prépare un texte à copier. Il ne transmet aucune demande. Le canal de réception sera ajouté après validation des coordonnées de l’entreprise.',company:'Entreprise',name:'Nom du contact',email:'E-mail professionnel',origin:'Ville de chargement',destination:'Destination au Maroc',date:'Date souhaitée',weight:'Poids (kg)',volume:'Volume (m³)',cargo:'Nature de la marchandise',equipment:'Équipement / contraintes',create:'Préparer le texte',copy:'Copier la demande',copied:'Demande copiée',foot:'Services, flotte, assurances et coordonnées en attente de validation.'},es:{draft:'Vista previa para validar por Hassan · no indexada',title:'Preparemos su solicitud de transporte a Marruecos.',intro:'Describa su necesidad: lugar de carga, destino, fechas y características de la mercancía.',form:'Preparar una solicitud de presupuesto',note:'Este formulario prepara un texto para copiar. No envía solicitudes. Se añadirá un canal de recepción tras validar los datos de contacto de la empresa.',company:'Empresa',name:'Nombre de contacto',email:'Correo profesional',origin:'Ciudad de carga',destination:'Destino en Marruecos',date:'Fecha deseada',weight:'Peso (kg)',volume:'Volumen (m³)',cargo:'Tipo de mercancía',equipment:'Equipo / requisitos',create:'Preparar texto',copy:'Copiar solicitud',copied:'Solicitud copiada',foot:'Servicios, flota, seguros y contacto pendientes de validación.'},ar:{draft:'مسودة لاعتماد حسن · غير مفهرسة',title:'نجهز طلب نقل بضاعتكم نحو المغرب.',intro:'حددوا احتياجكم: مدينة التحميل والوجهة والتاريخ وخصائص البضاعة.',form:'تجهيز طلب عرض ثمن',note:'النموذج يجهز نصا للنسخ ولا يرسل أي طلب. نضيف وسيلة الاستقبال بعد اعتماد بيانات التواصل مع الشركة.',company:'الشركة',name:'اسم مسؤول التواصل',email:'البريد المهني',origin:'مدينة التحميل',destination:'الوجهة بالمغرب',date:'التاريخ المطلوب',weight:'الوزن (kg)',volume:'الحجم (m³)',cargo:'نوع البضاعة',equipment:'التجهيز / المتطلبات',create:'تجهيز النص',copy:'نسخ الطلب',copied:'تم نسخ الطلب',foot:'الخدمات والأسطول والتأمينات وبيانات التواصل بانتظار الاعتماد.'}};let language='fr',draft={};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const t=texts[language];document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';document.getElementById('draft').textContent=t.draft;document.getElementById('foot').textContent=t.foot;document.getElementById('main').innerHTML=`<div class="hero"><div class="eyebrow">MA FRANCE TRANS</div><h1>${t.title}</h1><p>${t.intro}</p></div><section><h2>${t.form}</h2><form id="quote">${['company','name','email','origin','destination','date','weight','volume','cargo','equipment'].map(k=>`<label>${t[k]}<input name="${k}" type="${k==='email'?'email':k==='date'?'date':['weight','volume'].includes(k)?'number':'text'}" value="${esc(draft[k])}" ${['company','email','origin','destination'].includes(k)?'required':''} min="0" step="0.01" maxlength="1000"></label>`).join('')}<button class="wide" type="submit">${t.create}</button></form><p>${t.note}</p><div id="result" hidden><pre id="request"></pre><button id="copy" type="button">${t.copy}</button><p id="feedback" role="status"></p></div></section>`;document.getElementById('quote').onsubmit=e=>{e.preventDefault();draft=Object.fromEntries(new FormData(e.target));document.getElementById('request').textContent=Object.entries(draft).map(([k,v])=>t[k]+': '+v).join('\n');document.getElementById('result').hidden=false};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('request').textContent);document.getElementById('feedback').textContent=t.copied}catch{document.getElementById('request').focus()}}}document.getElementById('language').onchange=e=>{const form=document.getElementById('quote');if(form)draft=Object.fromEntries(new FormData(form));language=e.target.value;render()};render();
</script></body></html>
