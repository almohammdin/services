<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>العملاء | مسار</title>
<link rel="apple-touch-icon" sizes="180x180" href="/services/masar/assets/masar-icon-180.png?v=1">
<link rel="icon" type="image/png" sizes="32x32" href="/services/masar/assets/masar-icon-32.png?v=1">
<link rel="manifest" href="/services/masar/manifest.webmanifest?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#101828;--gold:#b59a55;--muted:#667085;--line:#d8dee8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f6f8fb,#edf2f7);font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;color:var(--navy);line-height:1.7}a{text-decoration:none;color:inherit}button,input,textarea{font:inherit}.shell{max-width:1120px;margin:auto;padding:20px}.top{background:linear-gradient(135deg,#101828,#263349);color:#fff;border-radius:28px;padding:22px;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{margin:0;font-size:28px}.top p{margin:6px 0 0;color:rgba(255,255,255,.74);font-size:13px}.btn{border:0;border-radius:14px;min-height:42px;padding:9px 14px;font-weight:900;background:#edf1f7;color:#101828;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.btn.gold{background:var(--gold)}.btn.dark{background:var(--navy);color:#fff}.grid{display:grid;grid-template-columns:340px 1fr;gap:14px;margin-top:14px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 12px 35px rgba(16,24,40,.06)}.field{margin-bottom:10px}.field label{display:block;font-size:12px;font-weight:900;color:#344054;margin-bottom:5px}input,textarea{width:100%;border:1px solid #cfd6e0;border-radius:13px;padding:10px 12px}textarea{min-height:100px}.list{display:grid;gap:10px}.client{border:1px solid #edf0f5;background:#fbfcfe;border-radius:18px;padding:14px;display:flex;justify-content:space-between;gap:12px}.client b{color:var(--navy)}.client small{display:block;color:var(--muted);margin-top:4px}.empty{border:1px dashed #cfd6e0;border-radius:18px;padding:18px;text-align:center;color:var(--muted);background:#fff}.notice{margin:14px 0;color:#475467;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:850px){.top,.grid{display:block}.top .actions{margin-top:12px}.card{margin-top:12px}}
</style>
<style>
[hidden]{display:none!important}.client{display:block}.client-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.client-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.client-actions .btn,.offer-link{font-size:12px;min-height:34px;padding:5px 10px}.client-offers{display:grid;gap:8px;margin-top:12px}.offer-line{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid #e8edf4;padding-top:8px}.offer-line span{font-size:12px;color:#475467}.offer-links{display:flex;gap:6px;flex-wrap:wrap}.offer-link{background:#eaf0f8;border-radius:10px;font-weight:700}.form-actions{display:flex;gap:8px}.form-actions .btn{flex:1}@media(max-width:600px){.client-head,.offer-line{display:block}.client-actions,.offer-links{margin-top:8px}}
</style>
<style>body:not(.ready) .shell{display:none}.ready .auth{display:none}.auth{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#101828,#263349)}.auth-card{width:min(410px,100%);padding:28px;border-radius:26px;background:#fff;text-align:center;box-shadow:0 26px 65px rgba(0,0,0,.22)}.auth-card h1{font-size:24px}.auth-card p{font-size:13px;color:var(--muted)}.auth-card .btn{width:100%;margin-top:12px}.auth-message{min-height:24px;color:#b42318;font-size:12px}</style>
<style>.client-contact{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.client-contact a{border:1px solid #d8dee8;background:#fff;border-radius:10px;padding:3px 8px;color:#163a70;font-size:12px;unicode-bidi:isolate}</style>
<style>html{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}button,.btn{transition:transform 140ms cubic-bezier(.23,1,.32,1)}button:active,.btn:active{transform:scale(.98)}@media(pointer:coarse){input,textarea{font-size:16px}}@media(prefers-reduced-motion:reduce){button,.btn{transition:none}}</style>
</head>
<body><section class="auth"><div class="auth-card"><h1>العملاء</h1><p>جارٍ فتح بيانات العملاء…</p></div></section><main class="shell">
<section class="top"><div><h1>مسار · العملاء</h1></div><nav class="actions" aria-label="أقسام مسار"><a class="btn" href="/services/masar/">الرئيسية</a><a class="btn gold" href="/services/masar/tool/">إعداد عرض</a><a class="btn" href="/services/masar/offers/">العروض</a></nav></section>
<p id="message" class="notice">جارٍ تحميل بيانات الحساب…</p>
<section class="grid"><div class="card"><h2 id="formTitle">إضافة عميل</h2><div class="field"><label for="cName">اسم العميل</label><input id="cName" autocomplete="organization"></div><div class="field"><label for="cPerson">الشخص المسؤول</label><input id="cPerson"></div><div class="field"><label for="cEmail">البريد الإلكتروني</label><input id="cEmail" type="email" inputmode="email" autocomplete="email" dir="ltr"></div><div class="field"><label for="cMobile">الجوال</label><input id="cMobile" type="tel" inputmode="tel" autocomplete="tel" dir="ltr"></div><div class="field"><label for="cWhatsapp">رقم واتساب</label><input id="cWhatsapp" type="tel" inputmode="tel" dir="ltr" placeholder="05xxxxxxxx"></div><div class="field"><label for="cNotes">ملاحظات</label><textarea id="cNotes"></textarea></div><div class="form-actions"><button class="btn dark" id="addBtn">حفظ العميل</button><button class="btn" id="cancelBtn" type="button" hidden>إلغاء التعديل</button></div></div><div class="card"><h2>قائمة العملاء</h2><div id="clients" class="list"></div></div></section>
</main>
<script type="module">
import {auth,authReady,onAuthStateChanged,loadWorkspace,saveClient,updateClient,clientKey,quoteKey,quoteSeriesKey,quoteVersion,serviceLabel} from '../data.js?v=20260926c';
const $=id=>document.getElementById(id),fmt=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
let user=null,clients=[],quotes=[],editingName=null;
function message(text){$('message').textContent=text}
function resetForm(){editingName=null;$('formTitle').textContent='إضافة عميل';$('addBtn').textContent='حفظ العميل';$('cancelBtn').hidden=true;for(const id of ['cName','cPerson','cEmail','cMobile','cWhatsapp','cNotes'])$(id).value=''}
function phoneHref(value){const raw=String(value||'').trim(),digits=raw.replace(/[^\d]/g,'');return digits.length>=7&&digits.length<=15?'tel:'+(raw.startsWith('+')?'+':'')+digits:''}
function whatsappHref(value){let digits=String(value||'').replace(/[^\d]/g,'');if(digits.startsWith('00'))digits=digits.slice(2);if(/^05\d{8}$/.test(digits))digits='966'+digits.slice(1);else if(/^5\d{8}$/.test(digits))digits='966'+digits;return /^\d{9,15}$/.test(digits)?'https://wa.me/'+digits:''}
function render(){
 const map=new Map(clients.map(c=>[clientKey(c.name),{...c,offers:[]}]));
 for(const q of quotes){const key=clientKey(q.client);if(!key)continue;const c=map.get(key)||{name:q.client,offers:[]};c.offers.push(q);map.set(key,c)}
 const rows=[...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'ar'));
 $('clients').innerHTML=rows.map(c=>{
  const groups=new Map();for(const q of c.offers){const key=quoteSeriesKey(q);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(q)}
  const series=[...groups.values()].map(versions=>versions.sort((a,b)=>quoteVersion(b)-quoteVersion(a)||String(b.updatedAtIso||'').localeCompare(String(a.updatedAtIso||''))));
  const value=series.reduce((sum,versions)=>sum+(Number(versions[0]?.amount)||0),0);
  const summary=fmt.format(series.length)+' '+(series.length===1?'عرض':'عروض')+(c.offers.length>series.length?' · '+fmt.format(c.offers.length)+' نسخ':'');
  const offerLines=series.map(versions=>'<div class="offer-line"><span>'+esc(serviceLabel(versions[0]))+'</span><div class="offer-links">'+versions.map(q=>'<a class="offer-link" href="/services/masar/tool/?quote='+encodeURIComponent(quoteKey(q))+'">فتح '+(versions.length>1?'النسخة '+fmt.format(quoteVersion(q)):'العرض')+'</a>').join('')+'</div></div>').join('');
   const contact='<div class="client-contact">'+(c.email?'<a href="mailto:'+encodeURIComponent(c.email)+'" title="إرسال بريد إلكتروني">✉ '+esc(c.email)+'</a>':'')+(phoneHref(c.mobile)?'<a href="'+phoneHref(c.mobile)+'" title="اتصال">☎ '+esc(c.mobile)+'</a>':'')+(whatsappHref(c.whatsapp)?'<a href="'+whatsappHref(c.whatsapp)+'" target="_blank" rel="noopener noreferrer" title="فتح واتساب">واتساب: '+esc(c.whatsapp)+'</a>':'')+'</div>';
   return '<article class="client"><div class="client-head"><div><b>'+esc(c.name)+'</b><small>'+(c.person?esc(c.person)+' · ':'')+summary+'</small><small>'+esc(c.notes||'')+'</small>'+contact+'</div><div class="client-actions"><span title="إجمالي قيمة العروض، وليس صافي أتعابك">قيمة العروض: '+fmt.format(value)+' ر.س</span><button class="btn" type="button" data-edit-client="'+esc(c.name)+'">تعديل البيانات</button></div></div>'+(offerLines?'<div class="client-offers">'+offerLines+'</div>':'')+'</article>';
 }).join('')||'<div class="empty">لا يوجد عملاء بعد.</div>';
}
$('clients').onclick=e=>{const btn=e.target.closest('[data-edit-client]');if(!btn)return;const c=clients.find(x=>clientKey(x.name)===clientKey(btn.dataset.editClient));if(!c)return;editingName=c.name;$('formTitle').textContent='تعديل بيانات العميل';$('addBtn').textContent='حفظ التعديلات';$('cancelBtn').hidden=false;$('cName').value=c.name;$('cPerson').value=c.person||'';$('cEmail').value=c.email||'';$('cMobile').value=c.mobile||'';$('cWhatsapp').value=c.whatsapp||'';$('cNotes').value=c.notes||'';$('cName').focus();window.scrollTo({top:0,behavior:'smooth'})};
$('cancelBtn').onclick=resetForm;
$('addBtn').onclick=async()=>{
 if(!user){location.replace('/services/masar/?next='+encodeURIComponent(location.pathname+location.search));return}
 const name=$('cName').value.trim();if(!name){$('cName').focus();return}
 if(!$('cEmail').checkValidity()){$('cEmail').reportValidity();return}
 if($('cMobile').value.trim()&&!phoneHref($('cMobile').value)){message('تحقق من رقم الجوال.');$('cMobile').focus();return}
 if($('cWhatsapp').value.trim()&&!whatsappHref($('cWhatsapp').value)){message('تحقق من رقم واتساب.');$('cWhatsapp').focus();return}
 if(!editingName&&clients.some(c=>clientKey(c.name)===clientKey(name))){message('هذا العميل موجود بالفعل؛ استخدم زر «تعديل البيانات» في بطاقته.');return}
 $('addBtn').disabled=true;
 try{const payload={name,person:$('cPerson').value.trim(),email:$('cEmail').value.trim(),mobile:$('cMobile').value.trim(),whatsapp:$('cWhatsapp').value.trim(),notes:$('cNotes').value.trim()};if(editingName){const result=await updateClient(user,editingName,payload);clients=result.clients;quotes=result.quotes;message('تم تحديث بيانات العميل وربط عروضه بالاسم الجديد.')}else{clients=await saveClient(user,payload,clients);message('تم حفظ العميل، وسيظهر في إعداد العرض.')}resetForm();render()}
 catch(e){console.error(e);message(e.message==='يوجد عميل بهذا الاسم بالفعل'?e.message:'تعذر حفظ العميل سحابيًا. لم تُفقد البيانات المدخلة.')}
 finally{$('addBtn').disabled=false}
};
await authReady.catch(console.error);
onAuthStateChanged(auth,async u=>{
 user=u;document.body.classList.toggle('ready',Boolean(u));
 if(!u){location.replace('/services/masar/?next='+encodeURIComponent(location.pathname+location.search));return}
 try{const workspace=await loadWorkspace(u);clients=workspace.clients;quotes=workspace.quotes;render();message('')}
 catch(e){console.error(e);message('تعذر تحميل بيانات الحساب. حاول تحديث الصفحة.')}
});
</script></body></html>
